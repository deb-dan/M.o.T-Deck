                              # self-describing; the installer reads build.opencode_pin)
                              # 2026-08-28 bump 1.18.19 → 1.18.23 (patch releases only).
    installed: false          # OPTIONAL — nothing depends on it; bootstrap never clones it
    enabled: false
    port: 4096                # ⚠️ upstream's OWN --port DEFAULT IS 0 (an ephemeral port,
                              # cli/network.ts at the pin) — 4096 is only the number its
                              # DOCS use. The start script ALWAYS passes --port explicitly;
                              # without it the tab would point at a port nothing listens on.
    depends_on: []            # NOT [runner]: it is usable against any provider it has
                              # configured, and our config fan-out is best-effort. Start
                              # the runner yourself for the local lane.
    # ⚠️ LICENSE: MIT. Clean — nothing propagates.
    # ⚠️ TOOL-CALLING IS REQUIRED. Every mutation is a native tool call and there is NO
    # aider-style text-edit fallback, so on a model that cannot emit one it looks BROKEN
    # rather than degraded. That is why chat models now carry a `tools` verdict
    # (bridge/modeltools.py) and why the start plan warns when the live model lacks it.
    # ⚠️ NO AUTH by default (OPENCODE_SERVER_PASSWORD unset) — loopback only, forever.
    #    Never pass --cors and never --mdns (the latter flips the host to 0.0.0.0).
    # ⚠️ AUTO-UPDATE IS ON BY DEFAULT upstream (cli/upgrade.ts: `if (config.autoupdate
    #    === false || Flag.OPENCODE_DISABLE_AUTOUPDATE) return`). We nail it shut BOTH
    #    ways — "autoupdate": false in the config we write AND OPENCODE_DISABLE_AUTOUPDATE=1
    #    at spawn. Never use its in-app upgrade: that is the pin-discipline rule.
    # ⚠️ It installs provider packages at RUNTIME with @npmcli/arborist (unpinned, needs
    #    network on first use). Confined to data/opencode/xdg/cache by the XDG_* env the
    #    start script sets — see start_component.sh — but it IS a floating dependency and
    #    it is why this install is ONLINE-ONLY and cannot ride the fat wheelhouse.

  # ── OPTIONAL THIRD CODING lane — DeepSeek Harness (docs/research/2026-09-02-deepseek-harness.md) ──
  # `dsh` is DeepSeek AI's own agent harness (Claude-Code-shaped, Cordis plugin
  # architecture). It is a TAB, not a PTY: `dsh web` serves its own SPA + its own
  # JSON/websocket API on ONE loopback port, the same shape as OpenCode's `serve`.
  deepseek:
    # NOT a git checkout and NOT a prebuilt binary. Upstream publishes a TypeScript
    # monorepo to npm; the install is `npm install @deepseek-ai/dsh@<pin>` into a
    # private prefix under data/deepseek/, which resolves ~455 packages (~283MB,
    # MEASURED 2026-09-03; ~7 min on a warm cache). Hermes/Odysseus weight class, not
    # OpenCode's one-Mach-O class. `repo` is informational — the PIN IS THE NPM VERSION.
    repo: https://github.com/deepseek-ai/deepseek-harness.git
    pin: "0.1.1-rc.2"         # = build.dsh_pin (kept here so the manifest is
                              # self-describing; the installer reads build.dsh_pin).
    installed: false         # OPTIONAL — nothing depends on it; bootstrap never installs it
                              # ⚠️ THIS IS THE SHIPPED DEFAULT AND MUST STAY false HERE.
                              # Install state is PER MACHINE and lives in the SNAPSHOT's
                              # copy of this file (ship.sh's manifest merge is additive-only
                              # and never overwrites an existing value). Running the
                              # installer against the REPO flips this line to true — which
                              # is correct behaviour AND a red gate
                              # (test_seam.py::test_harness_yaml_parses). Flip it back
                              # before committing; that is not a bug in either half.
    enabled: false
    port: 3080                # upstream's OWN default (dsh-host-webserver: `port:
                              # ctx.webStartup.port ?? 3080`, verified in the composed
                              # tree at the pin). Passed EXPLICITLY on the launch line
                              # anyway, and 3080 collides with nothing else in this file.
    depends_on: []            # NOT [runner]: same reasoning as OpenCode — it is usable
                              # against any provider it has configured, and our config
                              # fan-out is best-effort. The SOFT signal lives in
                              # bridge/routers/components.py::NEEDS_SOFT, which is what
                              # puts "the Runner is down" on its card without changing
                              # what a Start brings up.
    # ⚠️ LICENSE: MIT (root LICENSE, © DeepSeek 2026). THIRD_PARTY_NOTICES' only
    #    GPL-family entries are dev-only tooling, not linked into any shipped artifact.
    # ⚠️ PRE-1.0 DEVELOPER PREVIEW, and it says so itself (SAFETY.md: "experimental
    #    developer-preview software … has not undergone a security audit"). Fifteen npm
    #    versions to date, ALL 0.0.x/0.1.x with -rc/-alpha suffixes. PIN HARD.
    #    ⚠️ THE PIN IS UPSTREAM'S OWN `latest` DIST-TAG, NOT THE HIGHEST VERSION NUMBER.
    #    Measured 2026-09-03: dist-tags were latest=0.1.1-rc.2 (published 2026-08-21),
    #    next=0.1.2-rc.1 (published THAT MORNING), alpha=0.1.2-alpha.5. `next` and
    #    `alpha` are pre-release channels upstream has not promoted; taking the highest
    #    number would be tracking a branch, which is the thing this file's first line
    #    forbids. When bumping: read `npm view @deepseek-ai/dsh dist-tags` and take
    #    `latest` — and re-run the compat measurement in scripts/seed_deepseek_config.py.
    # ⚠️ NEEDS NODE >= 22.19 (or >= 24). The PUBLISHED package declares NO `engines`
    #    field (the ^22.19.0 || >=24.0.0 range lives in the monorepo root package.json,
    #    which npm never sees), so npm will NOT enforce it and a too-old Node fails at
    #    runtime with a confusing error. scripts/ensure_node.sh is what checks it:
    #    the user's own node ALWAYS wins, else we fetch build.node_pin into data/node.
    # ⚠️ FENCED HOME: $DSH_HOME = data/deepseek/home, exported at spawn. Upstream's
    #    default is ~/.dsh (dsh-home-paths::resolveDshHome — explicit config, then
    #    $DSH_HOME, then ~/.dsh). VERIFIED on a from-scratch walk: after an install,
    #    a --help, a web boot and eight headless turns, ~/.dsh, ~/.cache/dsh and
    #    ~/.config/dsh did not exist. Everything lands under $DSH_HOME.
    # ⚠️ TELEMETRY IS OFF AT THIS PIN BY DEFAULT — VERIFIED, not assumed. The composed
    #    tree's session-telemetry-otel row reads
    #    `mode: process.env.DSH_TELEMETRY_MODE || 'DISABLED'` (the brief's
    #    FEEDBACK_ONLY was the monorepo's older default). We ALSO export
    #    DSH_TELEMETRY_DISABLED=1 at spawn — upstream's own authoritative pre-load kill
    #    switch — so the default moving at a future pin cannot switch it on under us.
    # ⚠️ NO AUTO-UPDATER. Grepped the whole install for autoupdate/self-update/
    #    update-notifier/`npm install` machinery: nothing. So unlike OpenCode there is
    #    no in-app upgrade to nail shut — but the same rule applies to `npm update`.
    # ⚠️ NO pkill/killall ANYWHERE in the 455-package install (grepped). Clean.
    # ⚠️ LOOPBACK BY POLICY, not merely by default: the CLI refuses --host 0.0.0.0.
    #    No auth, by design, exactly like OpenCode's server and Hermes's dashboard.
    # ⚠️ THE FIRST THING IT ASKS FOR IS A WORKSPACE, and its folder picker is macOS's
    #    own (osascript `choose folder`), opened BY dsh — see ledger U67. The installer
    #    creates data/deepseek-workspace so there is an obvious answer.

# M1 runner slot — the swappable model engine the Bridge manages headless.
# Components (Hermes/Odysseus) consume runner.endpoint anonymously (never know it's Jan).
runner:
  adapter: auto            # auto = engine per model format (gguf→llamacpp, mlx→mlx-lm/mlx-vlm) | llamacpp | mlx  (jan retired 2026-07-23)
  llamacpp_pin: b10662       # pinned llama.cpp release tag (bNNNN) — scripts/install_llamacpp.sh fetches macos-arm64 binaries into data/llamacpp/
                             # 2026-08-06: b10094 → b10295. 2026-08-14: b10295 → b10427 (update sweep).
                             # NOTE release CI lags a fresh tag: b10297 existed but had NO macos-arm64 asset.
                             # b10427's llama-b10427-bin-macos-arm64.tar.gz WAS verified present (302 to the CDN;
                             # a bogus tag and a bogus filename both 404, so the check discriminates). Always pin a
                             # tag whose llama-<tag>-bin-macos-arm64.tar.gz actually exists.
                             # Every flag we depend on verified in the b10427 source: -a/--alias (arg.cpp:2966),
                             # --repeat-penalty (:2080), --spec-type (:4139, DRAFT_MTP still an enum member),
                             # llama-tts -m/-mm/-p/-o (tools/tts/tts.cpp:37), --tts-lang (:4317),
                             # --tts-speaker-file (:4325); -mv/--vocoder-model still ABSENT (our contract test
                             # asserts that absence — still correct).
                             # ⚠️ WATCH-ITEM (new in range, #26118): common_params_apply_system_config() now reads
                             # /etc/llama.cpp/config.ini then ${XDG_CONFIG_HOME:-~/.config}/llama.cpp/config.ini IF
                             # THEY EXIST, applied BEFORE env and CLI (our argv still wins). Neither file exists on
                             # Debi's Mac ⇒ no-op today, but llama-server's behaviour is no longer determined by our
                             # argv alone. ⚠️ install_llamacpp.sh keeps NO backup — copy data/llamacpp aside first.
                             #
                             # ── 2026-08-28: b10427 → b10662 (235 builds) ────────────────────────────
                             # Asset check first, same discriminating shape as before: llama-b10662-bin-
                             # macos-arm64.tar.gz → 200, and a bogus b99999 → 404. Rollback copies taken
                             # BEFORE installing: data/llamacpp.b10427.bak in BOTH the repo and the snapshot.
                             # Flag surface MEASURED, not read: `llama-server --help` diffed b10427 vs
                             # b10662 → 322 flags → 332. REMOVED: --hf-file-v, --hf-repo-v,
                             # --model-vocoder, --tts-use-guide-tokens — we use NONE of the four (grepped
                             # scripts/ + bridge/). ADDED (14, all ignorable): --kv-unified-per-slot,
                             # --load-mode, --mcp-servers-config, --mcp-servers-json, --mmproj-device,
                             # --n-cpu-ffn, --reasoning-effort, --spec-synth-len, --spec-synth-rates,
                             # --tensor-read-lazy, --tools-runtime, --video-ffmpeg-dir, --video-fps,
                             # --video-timestamp-interval. Every UNGATED flag start_component.sh passes is
                             # still present (--no-context-shift/--host/--port/--alias/--ctx-size/
                             # --no-cont-batching/--cache-ram/--fit/--model/--parallel/--mmproj), --spec-type
                             # still lists draft-mtp, --fit still takes [on|off], --api-key + the
                             # --repeat-penalty/--repeat-last-n pair intact. llama-tts re-measured too:
                             # -m/-mm/-p/-o/--tts-lang/--tts-speaker-file/-n all present, and
                             # -mv/--vocoder-model + --voice still ABSENT (the contract test's assertion of
                             # that absence is still correct). config.ini watch-item re-checked: neither
                             # /etc/llama.cpp/config.ini nor ~/.config/llama.cpp/config.ini exists ⇒ still
                             # a no-op. Live proof after the restart: version self-reports build 10662,
                             # the same 27B model reloads, a real /v1/chat/completions round-trip answers
                             # correctly at 14.3 tok/s (b10427 baseline was 12.3–12.6 on long contexts),
                             # the direct chat lane streams end-to-end, /api/models lists 16 models with
                             # live_id set, /api/status all green.
                             # ⚠️⚠️ REGRESSION THIS BUMP INTRODUCED, found and fixed — read before the next one:
                             # GET /v1/models is now GUARDED BY --api-key. Measured by running both
                             # binaries model-less with `--api-key testkey`: b10427 → 200 without a key,
                             # b10662 → 401. bridge/app.py::_runner_loaded_id (THE single source of truth
                             # for "what is live") sent no Authorization header and its docstring asserted
                             # that none was needed, so on b10662 it 401'd on every poll → _reconcile_live
                             # read "nothing loaded" → Mission Control showed the runner running:false /
                             # loaded:false WHILE IT WAS GENERATING, and runner.log gained one
                             # "unauthorized: Invalid API Key" per status poll. Fixed: the probe now sends
                             # the manifest's key (runner.api_key, or aux.api_key when probing the aux
                             # port). Pinned forever by bridge/contract_tests/test_llama_server_contract.py.
  binary:                  # explicit path to llama-server; empty = auto-discover (our pin → Jan backends → LM Studio)
  mlx_venv: data/mlx-venv   # created by scripts/install_mlx.sh
  port: 6767                 # canonical headless endpoint (jan serve --port)
  endpoint: http://127.0.0.1:6767/v1
  api_key: harness-local     # headless jan requires a key; fanned out to components in M1-B
  model: gemma-4-31B-it-uncensored-biproj-q4_k_m
  ctx_size: 65536            # >=64K (Hermes floor); desktop preset may raise it
  spec_mtp: auto             # MTP speculative decoding: auto = detect from the model id OR its
                             # source repo (e.g. unsloth/…-MTP-GGUF, persisted on download) |
                             # on = force (use for an MTP model acquired before repo tracking) |
                             # off = never. A failed spec launch auto-retries without the flags.

# OPTIONAL aux runner — a small second model (300MB–10GB class) for Odysseus's
# Background Tasks (auto-titles, search-query generation, memory extraction) so
# they stop contending with the main runner's single slot. Pick the model via
# "Set aux" in the Models pane; start/stop from the same pane. To wire it in:
# Odysseus admin settings → Background Tasks → endpoint http://127.0.0.1:6768/v1,
# api key harness-aux, and the aux model name.
aux:
  port: 6768
  endpoint: http://127.0.0.1:6768/v1
  api_key: harness-aux
  model:                      # empty = not configured; set from the Models pane

# Harness-native VOICE capability (FABLE-VOICE-CAPABILITY-SPEC, Phase B).
# NOT the optional voicestudio/voicebox components above — this is the all-MIT
# agents-can-speak path built on binaries we already ship: llama-tts (rides
# runner.llamacpp_pin) and mlx-audio (in data/mlx-venv). One-shot subprocesses:
# no port, no component card, no resident RAM — voice models cost DISK plus
# transient RAM while a clip renders.
# Both values are REGISTRY IDS (data/models.json entries with kind: "audio").
# EMPTY = the capability is off. Set from Models → Audio (the bridge rewrites
# these two lines in place, so the comments here survive).
voice:
  tts_model:                  # id of the default text-to-speech model ("" = off)
  stt_model:                  # id of the default speech-to-text model ("" = off; Phase D)

# Hermes LANE guard (2026-08-14). A small local thinking model can spiral into a
# deliberation loop that never terminates — and because it keeps EMITTING tokens,
# every silence-based watchdog in the relay is blind to it: the turn cooked the CPU
# until the 600s total-silence guard, and even then only the RELAY gave up while
# Hermes kept generating. max_turn_s bounds ONE UNBROKEN GENERATION SEGMENT, NOT the
# whole turn (2026-08-14h revision): the clock is armed at prompt.submit and RESET on
# every tool.start / tool.complete and on every approval/clarify answer, and it PAUSES
# while a card waits for you. So a legitimate hour-long research turn that keeps making
# tool calls is never touched — only a model deliberating for this long with nothing to
# show for it. On overrun the bridge sends session.interrupt (stopping the GENERATION)
# and ends the stream with a clear message.
#   0 = disabled. Absent or unparseable = 600 (a typo must not switch a guard off).
# NOTE this is a TOP-LEVEL block, deliberately not components.hermes.*: ship.sh's
# manifest merge is additive at the top level only, so a new sub-key under the
# already-present components.hermes would never reach the app snapshot.
hermes:
  max_turn_s: 600             # seconds in ONE generation segment; 0 = no limit

# Model-memory ledger — Bridge-side RAM accounting so main + aux (+ future voice)
# model loads can't blow past physical memory. Budget is < 64GB to leave headroom
# for the OS + apps; enforced (409) on model switch and aux start. Footprint is
# approximated by weight-file size (KV-cache/overhead absorbed by the headroom).
memory:
  budget_gb: 48               # model RAM budget (of 64GB — leave headroom for apps)

bridge:
  port: 8700                  # control panel + API
  gearbox_port: 8710          # OpenAI-compatible routing proxy (M2)

# FAT/offline installer (§G-phase3) — build_app.sh --fat reads these. The build bundles
# uv's standalone CPython + an arm64 wheelhouse so a fresh Mac provisions every component
# OFFLINE (no PyPI, no npm) on first run. Model weights still download later.
# ⚠️ PENDING FABLE QA: python_version pin — verify a current python-build-standalone /
# uv-managed release actually carries this cpython (build_app.sh --fat uses `uv python
# install <python_version>`; uv resolves the correct standalone tarball URL itself).
build:
  python_version: "3.12.11"   # standalone CPython bundled into the fat app (must match wheel tags)
  python_tag: cp312           # wheel ABI tag for the wheelhouse download (--python-version)
  # MLX runtime pins — SINGLE SOURCE OF TRUTH, read by scripts/install_mlx.sh (dev install),
  # scripts/build_app.sh (fat wheelhouse download) and scripts/firstrun_fat.sh (offline provision).
  # They MUST agree: if the wheelhouse bundles a version the installer doesn't ask for, an
  # OFFLINE first-run fails ("no matching distribution"). Bump = edit here only, rebuild fat,
  # then re-verify one MLX chat turn (and re-check the mlx wire-id path in bridge/app.py).
  mlx_lm_pin: "0.31.3"
  # 2026-08-14 bump 0.6.10 → 0.6.13 (update sweep): server arg surface changed
  # ADDITIVELY ONLY (+--kv-key-bits/--kv-value-bits/--kv-key-scheme/--kv-value-scheme/
  # --max-num-seqs); no removals, requirements.txt identical. Our launch line
  # (mlx_vlm.server --model/--host/--port) is unaffected.
  # 2026-08-28 bump 0.6.13 → 0.6.17 (four patch releases, 08-17…08-26). Arg surface
  # re-measured at the candidate by diffing mlx_vlm/server/cli.py's add_argument set:
  # ADDITIVE ONLY again — 34 flags → 35, the single new one being --reranker-model,
  # and NOTHING removed (measured, not assumed: the full add_argument sets were
  # diffed before/after the install) — so
  # start_component.sh's launch line (--model/--host/--port) and its source-gated
  # `--max-tokens` floor both still hold. mlx-lm/mlx-audio/mlx-whisper stay pinned
  # where they are — install_mlx.sh asks for all four explicitly, so this bump
  # cannot drag mlx-audio to 0.5.0 (the deliberately-deferred risky one).
  mlx_vlm_pin: "0.6.17"
  # mlx-audio powers the MLX half of the harness-native voice capability (the
  # `voice:` block above). It is ALREADY pulled in transitively as an mlx-vlm dep,
  # so pinning it here just makes the version deliberate: the provisioned venv had
  # 0.4.4 while the Phase-0 recon read 0.4.7 sources — install_mlx.sh now asks for
  # the recon'd version so installed reality matches the argv surface we build.
  # 2026-08-14 bump 0.4.7 → 0.4.8 (update sweep). The CLI_PARITY_KWARGS re-derivation
  # rule was DISCHARGED by measurement, not assumption: mlx_audio/tts/generate.py and
  # mlx_audio/stt/generate.py are md5-IDENTICAL between 0.4.7 and 0.4.8, and
  # tts/models/omnivoice/ is identical too — so the argparse default dict that
  # bridge/voice_worker.py mirrors cannot have changed. The rule still stands for
  # every FUTURE bump (a drift there is silently-wrong audio, not an error).
  # 0.4.8 is a RESAMPLING-QUALITY release (new mlx_audio/resample.py replacing the
  # scipy resample_poly path, streaming miniaudio downsample, istftnet changes).
  # ⚠️ The honest risk is AUDIO, not API — istftnet is the Kokoro/kitten vocoder and
  # the resample path feeds every reference clip. Also: RenderCache keys do NOT
  # include the engine version, so 0.4.7-era cached renders keep being served after
  # the bump — A/B with fresh text or after a bridge restart.
  mlx_audio_pin: "0.4.8"
  # mlx-whisper: the STT half (Phase D dictation). One-shot `mlx_whisper` console
  # script out of the SAME data/mlx-venv — no second venv, no torch. Pin per the
  # Fable spec amendment §6.
  mlx_whisper_pin: "0.4.3"
  # ── build-time toolchain the harness provisions for ITSELF (never brew, never sudo) ──
  # bun: compiles the Vite SPAs of the two OPTIONAL voice components. Read by
  # scripts/ensure_bun.sh, which lands it at data/bun/bin/bun (~35MB download) ONLY if
  # the user has no bun of their own. Build-time only — nothing at runtime needs it, and
  # the FAT/offline installer never touches it (voice components are online-only).
  # Pin = the latest oven-sh/bun release as of 2026-08-07 (published 2026-05-13); the
  # bun-darwin-aarch64.zip asset was verified present at this tag before pinning.
  bun_pin: "bun-v1.3.14"
  # imageio-ffmpeg: a pip wheel that BUNDLES a static ffmpeg binary (macos arm64 wheel
  # 21.1MB, BSD-2-Clause). scripts/ensure_ffmpeg.sh installs it into the calling
  # component's venv and copies the binary to data/ffmpeg/bin/ffmpeg — this is how we
  # satisfy voicebox/voicestudio's ffmpeg need with no `brew install ffmpeg`.
  # ⚠️ bundles ffmpeg only, NOT ffprobe.
  imageio_ffmpeg_pin: "0.6.0"
  # ── MUSIC LANE (FABLE-MUSIC-LANE-SPEC, 2026-08-20) ──────────────────────────
  # Both engines were MEASURED on Debi's Mac before adoption (numbers in
  # docs/handoff/MUSIC-MEASUREMENT-RUNBOOK.md) and both passed the ear test, so both
  # ship. Read by scripts/install_music.sh (awk, same pattern as the mlx pins) and by
  # bridge/music.py's install DETECTION — the minimax pin is half of the HF cache path
  # a snapshot lands at, so changing it here really does mean "a different install".
  #
  # MiniMax-Music3, pure-MLX port. The "pin" is an HF REVISION SHA, not a git tag:
  # code and weights ship together in one HF repo (~11.9GB int8). Read live from the
  # HF API 2026-08-20. ⚠️ the port pins mlx==0.30.6 in its own requirements.txt, which
  # is WHY it gets data/music-venv — data/mlx-venv ships mlx 0.32.0 and must never be
  # downgraded under the runner. Weights: MiniMax-Music3 Community License (amber, see
  # LICENSE_OVERRIDES in bridge/app.py — several repacks mistag it apache-2.0).
  music_minimax_pin: "0505e3f04ddfb883e0a2fbd8ad1a34c2f313e514"
  # acestep.cpp (GGML/Metal, MIT) — a git COMMIT sha, recorded from the clone that
  # produced the measured number. Built with a direct `cmake`, NOT upstream's
  # buildcpu.sh (that script calls `nproc`, which does not exist on macOS, and forces
  # -DGGML_BLAS=ON which upstream only asks for on Linux). ⚠️ NEVER run its server.sh:
  # it binds 0.0.0.0. We only ever exec ./build/ace-lm and ./build/ace-synth.
  acestep_pin: "9761469d95fc204b5468623c68a1a2203e50b1f9"
  # ── AIDER coding agent (docs/research/2026-08-20-aider-recon.md, slice 1) ────
  # A git COMMIT on `main`, deliberately NOT the v0.86.0 tag: that tag is ~1 year old
  # and predates the Feb-2026 dependency refresh (openai 2.x / litellm 1.82) that a
  # current OpenAI-compatible endpoint wants. A bare-commit pin is native here —
  # components.odysseus is pinned the same way, on a non-default branch.
  # Verified LIVE 2026-08-21: this sha is a real merge commit on Aider-AI/aider
  # ("Merge pull request #5173 …", authored by paul-gauthier) — i.e. upstream is slow,
  # not dead. The fork cecli-dev/cecli was REJECTED: it re-introduces agent-mode
  # tool-calling, which is exactly the property aider was chosen for NOT having
  # (a 4B cannot tool-call reliably; aider's edit formats are plain text).
  # Plan B, documented not adopted: if main goes >6 months without a commit, move to
  # cecli-dev/cecli at a release tag (Apache-2.0 verified) keeping --edit-format whole.
  # Read by scripts/install_aider.sh (awk, same pattern as the other pins).
  aider_pin: "5dc9490bb35f9729ef2c95d00a19ccd30c26339c"
  # ── GOOSE, the third agent lane (docs/research/2026-08-28-goose-source-verify.md) ──
  # ⚠️ THESE FOUR KEYS ARE DOCUMENTATION, NOT THE PIN THE INSTALLER READS. Every other
  # *_pin here is read back out of this file by its installer's `_yb` awk; goose's
  # constants live in scripts/install_goose.sh instead, because the pin is FOUR values
  # that must move TOGETHER (tag, asset size, asset sha256, extracted-binary sha256) and
  # a manifest edit that moved one of them without the others would be a way to install
  # bytes nobody measured. bridge/contract_tests/test_goose_contract.py asserts these
  # values and the script's agree, so this block can never quietly go stale.
  # LICENSE: Apache-2.0, verified at source at this sha; no NOTICE file exists upstream.
  # github.com/block/goose HTTP-301s to aaif-goose/goose — a redirect, not a fork.
  # ⚠️ v2.0 RELEASE CANDIDATE tags exist upstream (v2-rc.1, v2.0.0-rc-04-27-0). The sha
  # pin insulates us; evaluating v2 is its own sitting, not a bump.
  # ⚠️ TOOL-CALLING IS REQUIRED and there is NO text-edit fallback, so on a model that
  # cannot emit one goose looks BROKEN rather than degraded — the same property that
  # gives the opencode lane its `tools` verdict. The Goose tab carries the same warning.
  #   The experimental "toolshim" does NOT change this: its interpreter backends are
  #   ollama / goose's own bundled llama.cpp only, so it cannot point at our :6767.
  # ⚠️ NOT A COMPONENT: no `components.goose` block, no port, no card, no daemon. It is
  # a PTY lane (bridge/pty_goose.py), because goose has NO browser UI — verified at
  # source: no `web` and no `ui` subcommand, and `goose serve` is an ACP client API.
  goose_pin: "v1.48.0"
  goose_src_sha: "25021517f12cab87c94bed0874fe7d28168dc264"
  goose_asset_sha256: "d502945fca78d8e58c8f56932973f454ad57d0754b272f5d44f696a4722da49a"
  goose_bin_sha256: "e900f1b96662818791ee599c58ea0e44204ca29579dd182ecc238b732ef5d768"
  # ── OPENCODE, the second coding lane (recon 2026-08-21, slice 2026-08-21) ────
  # An NPM VERSION, not a git sha: upstream publishes a prebuilt native binary per
  # platform and `npm i` is just a download. Verified LIVE against registry.npmjs.org
  # 2026-08-21: opencode-ai@1.18.19 is MIT, declares optionalDependencies including
  # opencode-darwin-arm64@1.18.19, and THAT package's tarball contains exactly two
  # files — package.json and `package/bin/opencode`, a 143.7MB Mach-O 64-bit arm64
  # executable already mode 0755, with the web SPA EMBEDDED (thousands of vite
  # `assets/…` entries in its strings, so the tab needs no network for its UI).
  # npm's dist.shasum for the 1.18.19 arm64 tarball was de1489448cf8eb0180b807f5e4a75e6b6614fef1.
  # ⚠️ That number is DOCUMENTATION, not a constant: install_opencode.sh reads
  # dist.shasum from the registry for whatever version the pin names and verifies the
  # download against THAT, so a bump needs no code edit — only this comment refreshed.
  # A bump = edit here, re-run the installer, and re-check three things in the new
  # source: the `serve` subcommand's network options (--port/--hostname), the
  # `autoupdate` config key + OPENCODE_DISABLE_AUTOUPDATE flag, and that the four
  # XDG_* variables still drive packages/core/src/global.ts (they are the ONLY thing
  # keeping its config/cache/data/state inside data/opencode). The shipped artifact is
  # a stripped Mach-O with the SPA embedded, so at a bump those three are verified
  # BEHAVIOURALLY (serve --help + the live /provider check + where files actually land),
  # not by reading source we do not have.
  # 2026-08-28 bump 1.18.19 → 1.18.23 (four patch releases). Verified live against
  # registry.npmjs.org: opencode-ai@1.18.23 is MIT and declares
  # opencode-darwin-arm64@1.18.23, whose dist.shasum is
  # 3085492a00e566a3d64e781bbc849bc9c8adc33d.
  opencode_pin: "1.18.23"
  # ── DEEPSEEK HARNESS lane (components.deepseek above carries the reasoning) ──
  # The npm version of @deepseek-ai/dsh. Read LIVE from registry.npmjs.org 2026-09-03:
  # `npm view @deepseek-ai/dsh dist-tags` → latest=0.1.1-rc.2, next=0.1.2-rc.1,
  # alpha=0.1.2-alpha.5. THIS IS `latest` — the channel upstream promotes — not the
  # highest number. dist.shasum 1a5112369f1c46b13a6e6f21de8af5e6afd45074;
  # dist.integrity sha512-UP1UIh6q3Gme/yXRn/QL2P8IsVlv8Shpg22TRJIZPsCRWLm4CBiA1MUvXmJAfsOEETBMLAl+xWPtFw6ICsN3wg==.
  # npm itself verifies that integrity hash on every fetch of the top-level package;
  # the TRANSITIVE tree is range-resolved on the FIRST install and then frozen into
  # data/deepseek/npm/package-lock.json (lockfileVersion 3, 513 entries, MEASURED), so
  # every later repair/reinstall is `npm ci` off that lock and is byte-reproducible.
  # That is as far as pinning goes in this ecosystem; the ledger row says so out loud.
  dsh_pin: "0.1.1-rc.2"
  # Node: the RUNTIME @deepseek-ai/dsh needs (>= 22.19, or >= 24). Same three-step
  # resolution and single-source-of-truth idiom as bun_pin — the user's own node on
  # PATH ALWAYS wins and is never shadowed; this pin is only the download fallback
  # (scripts/ensure_node.sh → data/node, verified against nodejs.org's own
  # SHASUMS256.txt, no sudo, nothing written outside the tree).
  # Pin = the newest Node LTS as of 2026-09-03, read live from nodejs.org/dist/index.json
  # (v24.20.0, "Krypton", released 2026-08-26), which satisfies the >= 24 half of the
  # range. MEASURED on this machine: the node already on PATH is v22.23.1, which
  # satisfies the ^22.19 half, so the fallback did not fire on the walk.
  node_pin: "v24.20.0"
  # ── OFFICE lane (docs/research/2026-08-20-office-lane-recon.md, slice 1: SHEETS) ──
  # Univer, Apache-2.0, vendored as UMD assets our OWN bridge serves — no new process,
  # no port, no component card. Read by scripts/fetch_vendor_assets.sh (awk, same
  # pattern as the other pins) which fetches five files into
  # bridge/panel/assets/vendor/univer/ (~10.5MB: presets 7.1MB + preset-sheets-core
  # 3.2MB + 82KB css + the en-US locale + the rxjs peer bundle).
  # Pin = the npm `latest` of @univerjs/presets and @univerjs/preset-sheets-core,
  # read LIVE from registry.npmjs.org 2026-08-21 (a 1.0.0-beta.1 exists and is
  # deliberately NOT taken). BOTH packages must move together — they are one release
  # train and the preset is loaded into the presets runtime.
  # ⚠️ Univer's own .xlsx import/export is Univer Pro (a Docker server + a commercial
  # licence) and we do not use it: bridge/office.py owns the round-trip via openpyxl,
  # which is the escape hatch Univer's own docs name. A bump here is a UI-surface
  # bump only — but re-check IWorkbookData/IStyleData key names and the CellValueType
  # / HorizontalAlign / VerticalAlign enums bridge/office.py mirrors, because a
  # renumbered enum is a silently wrong cell, not an error.
  univer_pin: "0.25.1"
  # uv: the venv/installer the PORTABLE first-run bootstraps with (scripts/firstrun.sh).
  # It used to curl|sh the UNPINNED astral.sh installer — i.e. a fresh Mac provisioned
  # against whatever uv shipped that day. Pinned = the same idiom as bun_pin: the URL
  # form https://astral.sh/uv/<version>/install.sh is documented by upstream, and the
  # install lands in data/uv/bin via UV_UNMANAGED_INSTALL (no ~/.local/bin, no shell
  # profile edits, no self-update — the same no-writes-outside rule as ensure_bun.sh).
  # A uv the user already has ALWAYS wins; this is only the download path.
  # Pin = the current uv release as of 2026-08-08 (crates/uv-version/Cargo.toml).
  uv_pin: "0.12.3"

inference:
  # hermes_llm block removed 2026-07-20 (M1-B): Hermes + Odysseus now consume the `runner`
  # block above (endpoint + api_key), so the runner is the single source for the model endpoint.
  endpoints:
    cookbook:  { url: "http://127.0.0.1:8000/v1",  kind: local }   # Odysseus Cookbook serve
    ollama:    { url: "http://127.0.0.1:11434/v1", kind: local }   # optional
    lmstudio:  { url: "http://127.0.0.1:1234/v1",  kind: local }   # optional (MLX models)
  cloud: []                   # e.g. anthropic, openrouter — keys live in .env, never here

paths:
  vendor: ./vendor
  skills: ./skills
  data: ./data                # gitignored: venvs, logs, staging checkouts
