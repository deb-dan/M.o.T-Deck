    pin: c9dd68d890a7c0ee0df9a0e351ce22aafd6c7c0f   # dev@c9dd68d — 2026-08-28 bump (103 commits, contract-checked): inject_messages/chat_stream/sessions/auth/mcp/history intact, _explicit_web_intent OK, seed deps (ModelEndpoint/get_db_session/src.settings load_settings/save_settings) present, X-Frame policy unchanged. requirements.txt byte-identical → no venv reinstall. WATCH: INTERNAL_TOOL_USER moved core/middleware.py → src/owner_identity.py (we import neither); SECURE_COOKIES now defaults to "follow the request scheme" instead of false (ours is unset + plain-HTTP loopback → still a non-Secure cookie, login unaffected); new OAUTH_REDIRECT_BASE_URL defaults to http://localhost:$APP_PORT, which is wrong for remote-MCP OAuth because we serve on 7860 without APP_PORT. (prev 25c9e735)
