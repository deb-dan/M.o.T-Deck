# Harness — single source of truth for pins, ports, endpoints.
# Every change to a pin should be a git commit (that's your rollback history).

components:
  hermes:
    repo: https://github.com/NousResearch/hermes-agent.git
    pin: v2026.7.20           # release tag — never track a branch (bumped from v2026.7.7.2, Fable-checked 2026-07-21)
    installed: true
    enabled: false
    port: 9119                # hermes serve REST API (persistent surface)
    depends_on: [runner]      # needs the model endpoint up first (one-switch closure)
  odysseus:
    repo: https://github.com/pewdiepie-archdaemon/odysseus.git
    pin: e57f60bd343a748af9c855b73ba998ea8b3b652c   # 2026-07-20; fixes chat_routes NameError _explicit_web_intent (old pin 168f5930 was broken)
    installed: true
    enabled: false
    port: 7860                # native macOS default (7000 often held by AirPlay)
    depends_on: [runner, searxng]   # model endpoint + private search (one-switch closure)
    admin_user: admin         # used by the Bridge's chat-pane proxy (server-side login)
    admin_password: admin123  # keep in sync if you change the Odysseus account
  searxng:
    repo: https://github.com/searxng/searxng.git
    pin: main                 # shallow clone; source-only project (not on PyPI)
    installed: true
    enabled: false
    port: 8080                # private meta-search; Odysseus SEARXNG_INSTANCE defaults here

# M1 runner slot — the swappable model engine the Bridge manages headless.
# Components (Hermes/Odysseus) consume runner.endpoint anonymously (never know it's Jan).
runner:
  adapter: llamacpp        # llamacpp | mlx | jan | lmstudio (jan/lmstudio = fallback apps)
  binary:                    # path to llama-server; empty = auto-discover newest in Jan's backends dir
  port: 6767                 # canonical headless endpoint (jan serve --port)
  endpoint: http://127.0.0.1:6767/v1
  api_key: harness-local     # headless jan requires a key; fanned out to components in M1-B
  model: Qwen3_6-35B-A3B-Uncensored-HauhauCS-Aggressive-IQ4_XS   # M2 model browser makes this dynamic
  ctx_size: 65536            # >=64K (Hermes floor); desktop preset may raise it

# OPTIONAL aux runner — a small second model (300MB–10GB class) for Odysseus's
# Background Tasks (auto-titles, search-query generation, memory extraction) so
# they stop contending with the main runner's single slot. Pick the model via
# "Set aux" in the Models pane; start/stop from the same pane. To wire it in:
# Odysseus admin settings → Background Tasks → endpoint http://127.0.0.1:6768/v1,
# api key harness-aux, and the aux model name.
aux:
  port: 6768
  endpoint: http://127.0.0.1:6768/v1
  api_key: harness-aux
  model:                      # empty = not configured; set from the Models pane

bridge:
  port: 8700                  # control panel + API
  gearbox_port: 8710          # OpenAI-compatible routing proxy (M2)

inference:
  # hermes_llm block removed 2026-07-20 (M1-B): Hermes + Odysseus now consume the `runner`
  # block above (endpoint + api_key), so the runner is the single source for the model endpoint.
  endpoints:
    cookbook:  { url: "http://127.0.0.1:8000/v1",  kind: local }   # Odysseus Cookbook serve
    ollama:    { url: "http://127.0.0.1:11434/v1", kind: local }   # optional
    lmstudio:  { url: "http://127.0.0.1:1234/v1",  kind: local }   # optional (MLX models)
  cloud: []                   # e.g. anthropic, openrouter — keys live in .env, never here

paths:
  vendor: ./vendor
  skills: ./skills
  data: ./data                # gitignored: venvs, logs, staging checkouts
