# Harness — single source of truth for pins, ports, endpoints.
# Every change to a pin should be a git commit (that's your rollback history).

# ⛔ THERE IS NO `version:` KEY HERE ANY MORE — AND PUTTING ONE BACK IS A BUG (U56,
# 2026-09-02). It used to read `version: "0.1.0"   # bump on release`; nothing bumped it
# in 72 releases, and it was the ONLY thing /api/version ever read. So the Version tile
# showed 0.1.0 at release 1.5.72, and the update check compared GitHub tags against
# 0.1.0 — which makes ANY tag newer for ever. THE RELEASE VERSION IS THE TOP-LEVEL
# `VERSION` FILE: QA bumps it in the same commit as the slice, ship.sh copies it into
# the snapshot, build_app.sh seeds it into the fat app, and
# bridge/core/procs.py::harness_version is its ONE reader. A second copy of a fact is a
# second answer. Fenced by bridge/contract_tests/test_version_truth_contract.py.

components:
  hermes:
    repo: https://github.com/NousResearch/hermes-agent.git
    pin: v2026.8.13           # release tag — never track a branch.
                              # ⚠️⚠️ 2026-08-28: THE v2026.8.27 (v0.20.6) BUMP WAS ATTEMPTED, PROVEN
                              # UNSHIPPABLE AND ROLLED BACK. Do not retry above v2026.8.16 without
                              # reading docs/handoff/HERMES-v0.20.6-BLOCKED-2026-08-28.md first — the
                              # blocker is TWO upstream bugs, not our integration, and the whole record
                              # (including everything that DID pass) is in that file.
                              #
                              # ══ 2026-08-28: v2026.8.27 (v0.20.6) ATTEMPTED → ROLLED BACK ══
                              # The bump was built, shipped, restarted and WALKED on the real stack. It
                              # is blocked by TWO upstream bugs in Hermes v0.20.3+ (NOT by our
                              # integration, which passed everything else). Do not retry above
                              # v2026.8.16 until upstream fixes them.
                              #
                              # THE BLOCKER, in one sentence: mcp 2.0.0 renamed every model field to
                              # snake_case and kept camelCase only as a SERIALIZATION alias — pydantic
                              # aliases do not apply to attribute access — and Hermes v0.20.6 missed two
                              # of its own `getattr(obj, "camelCase")` reads:
                              #   · tools/mcp_tool.py:4643 `_annotation_read_only_hint` reads
                              #     `getattr(annotations, "readOnlyHint")` → always None on mcp 2.x, so
                              #     EVERY read-only MCP tool on an `untrusted` server is classified
                              #     write-capable and gets an approval card. REPRODUCED live: a real 27B
                              #     turn calling office_list raised "This tool is write-capable (no
                              #     readOnlyHint=true annotation)" and was denied. That is the whole v2
                              #     zero-card LOffice consent design inverted.
                              #   · tools/mcp_tool.py:7374 the schema-cache WRITER reads
                              #     `getattr(mcp_tool, "inputSchema")` → None, so it persists
                              #     `inputSchema: {}`. REPRODUCED on disk: ~/.hermes/cache/
                              #     mcp_schema_cache.json now holds all four loffice tools with an EMPTY
                              #     schema and readOnlyHint:false. Any cache-registered ("lazy") start
                              #     hands the model tools with no arguments.
                              # Upstream built the fix helper for exactly this (`mcp_field(obj, snake,
                              # camel, default)`, mcp_tool.py:488 — its docstring even names both failure
                              # modes, "failed tool calls read as successful, tool schemas read as
                              # empty") and applied it in 19 places. These two, plus :2284
                              # `requestedSchema`, were missed. There is NO fix from our side: our server
                              # already sends camelCase on the wire correctly, and pydantic DROPS unknown
                              # extra keys, so no wire payload can make the SDK object expose a
                              # `readOnlyHint` attribute. Editing vendor/hermes is out (compose over
                              # APIs, never fork) and flipping `trust: untrusted` → `full` would disarm a
                              # documented fence to hide an upstream bug.
                              #
                              # WHAT DID PASS AT v0.20.6, and is worth knowing next time:
                              #  · our HAND-WRITTEN Streamable-HTTP server needs NO change for mcp 2.0.0.
                              #    The SDK keeps two eras (`mcp_types.version` splits
                              #    HANDSHAKE_PROTOCOL_VERSIONS …2025-11-25 from MODERN_PROTOCOL_VERSIONS
                              #    2026-07-28) and Hermes deliberately stays on the handshake era
                              #    (mcp_tool.py:261-267, :3616-3624 — it never calls `negotiate_auto`, so
                              #    `server/discover` is never sent to us). All three transport rules hold
                              #    in the 2.0.0 client: 202-for-a-notification, application/json accepted,
                              #    405 tolerated on the GET. PROVEN on the wire: the handshake test listed
                              #    all four tools with correct schemas. NO new bridge dependency — the
                              #    no-FastMCP ruling stands.
                              #  · the path-guard fence + approval cards still work: a real turn asking
                              #    write_file for ~/Desktop raised "path-guard: write outside workspace"
                              #    and the file was never created.
                              #  · a real Hermes-lane chat turn streamed end-to-end through the bridge SSE.
                              #  · the contract gate went 139 → 142 green after five mirror updates; all
                              #    five are upstream refactor-MOVES, and all five mirrors were written to
                              #    pass at BOTH tags, so they are KEPT at the rolled-back pin.
                              # Full record + the retry plan: docs/handoff/HERMES-v0.20.6-BLOCKED-2026-08-28.md
                              #
                              # (2026-08-14 bump v2026.7.30 → v2026.8.13 (update sweep; 2565 commits in range).
                              # Contract-checked against a real v2026.8.13 checkout: 13/14 asserts passed; the ONE
                              # failure was a COSMETIC import reformat in hermes_cli/plugins.py (the tools.approval
                              # import became parenthesised multi-line at L5884) — resolve_pre_tool_block still exists
                              # (L5851) and still CALLS request_tool_approval (L5900), so the path-guard escalation is
                              # unbroken. The TEST was widened (both forms + the call site) — see
                              # bridge/contract_tests/test_hermes_ws_contract.py.
                              # Verified present at the candidate: all 8 /api/ws JSON-RPC methods + all 9 events,
                              # HERMES_DASHBOARD_SESSION_TOKEN, the approval protocol (choices/_redact/resolve/
                              # is_interrupted), pre_tool_call in VALID_HOOKS w/ block|approve|message|rule_key,
                              # mcp_servers config shape, loopback ⇒ no auth, HERMES_DESKTOP cron ticker, web_dist.
                              # ⚠️ WATCH-ITEM: --port/--host/--insecure/--skip-build moved into a shared
                              # _add_server_runtime_args(); --no-open is still a real flag on `dashboard` (only the
                              # `serve` copy is SUPPRESS). A now-hidden --tui compat shim carries a comment saying it
                              # is "safe to delete once the floor app version is well past 0.16.0" — evidence upstream
                              # DOES prune dashboard flags. Our contract test pins --no-open/--skip-build.
                              #
                              # POST-BUMP RECONCILIATION (2026-08-14, the FULL gate — the pre-bump sweep above ran
                              # only the WS contract, so it saw 13/14; the whole suite is 102 and found 3 more):
                              #  1. BEHAVIOURAL — _DEFAULT_OFF_TOOLSETS gained `a2a` (tools_config.py:156). Our mirror
                              #     HERMES_DEFAULT_OFF_TOOLSETS was stale, so "Hermes's defaults" would have switched
                              #     a2a ON. Mirror corrected. (Latent in practice: a2a is a deferred-loading bundled
                              #     platform plugin, so the row is normally absent from the catalog.)
                              #  2. COSMETIC — _load_enabled_toolsets is now PARAMETERISED (server.py:4267). The arg
                              #     is the SESSION SOURCE, not the platform_toolsets key: the config read on :4399 is
                              #     still a hardcoded "cli", so the lever is unchanged. Test re-pinned, plus a NEGATIVE
                              #     that the session platform is not what selects the key.
                              #  3. COSMETIC — the `project` fold literal became _gui_surface_toolsets(platform)
                              #     (server.py:4246/4410). `project` is still unconditional; `desktop_ui` is added for
                              #     desktop-sourced sessions only, and ours send source="harness", so the Check card's
                              #     count is still complete. Both halves now pinned.
                              # ⚠️ The one to remember at the NEXT bump: HERMES_DESKTOP=1 (set by start_component.sh
                              # for the cron ticker) is exactly what makes a source-less session resolve to "desktop".
                              # Only our explicit session `source` keeps this lane off that surface.
                              # — end of the v2026.8.13 record.)
                              # (prev v2026.8.13, before that v2026.7.30, v2026.7.20)
    installed: true
    enabled: false
    port: 9119                # hermes serve REST API (persistent surface)
    depends_on: [runner]      # needs the model endpoint up first (one-switch closure)
  odysseus:
