/* ⚠️ EACH SECTION RENDERS INSIDE ITS OWN try/catch — a walked defect on /comfy, not
   defensive boilerplate: one throw inside a renderer unwound the whole render and
   three sections painted EMPTY, which reads as "there is nothing here" rather than
   "this half is broken". A section that throws says so, in that section, in one line;
   every other section still draws, and the poll lets a transient fault self-heal. */
function section(name, el, fn) {
  try { return fn(); }
  catch (e) {
    try {
      const box = $(el);
      if (box) box.innerHTML = '<p class="say bad">' + esc(name) + ' failed to draw: ' +
        esc(String(e && e.message || e)) + ' — retrying on the next poll.</p>';
    } catch (e2) { /* the error path may never throw */ }
    return null;
  }
}

function render() {
  TIPS = {};                     /* the registry is per-render: no stale verdicts */
  section('header', 'pageerr', renderHeader);
  section('stage', 'stage-body', renderStage);
  section('tracks', 'strip', renderStrip);
  section('engines', 'engbody', renderEnginesBlock);
  section('queue', 'queuebody', renderQueueBlock);
  section('structure', 'secbody', renderStructure);
  section('prompts', 'reusebody', renderReuseBlock);
  section('library', 'libbody', renderLibraryBlock);
  section('folder', 'diskbody', renderDiskBlock);
  section('dock', 'dockchip', renderDock);
  section('composer', 'sbody', renderComposer);
  section('sheet', 'sheet', renderSheet);
  writeBack();
  arm(running() || installing() ? 1000 : 20000);
}

/* ══ WRITE-BACK (the Pixelmator mechanic) ══════════════════════════════════════
   When a render finishes, the values ACTUALLY used — the engine, the resolved length,
   the steps, the format — land in the ordinary controls, so what the user sees is what
   they can edit and re-run. The seed deliberately does NOT: it stays empty so the next
   song is a new one, and the drawn seed lives on the finished track's caption chip,
   which is click-to-reuse. */
function writeBack() {
  const j = job();
  if (!j || j.state !== 'done' || S.wroteBack === j.id) return;
  S.wroteBack = j.id;
  if (j.engine) S.form.engine = j.engine;
  if (j.seconds) S.form.seconds = Number(j.seconds);
  if (j.steps) S.form.steps = String(j.steps);
  if (j.format) S.form.format = j.format;
  S.form.seed = '';
  S.sel = null;                  /* the newest track is what the stage should show */
  section('composer', 'sbody', renderComposer);
}

/* ── the timer ──────────────────────────────────────────────────────────────── */
let timer = null, cadence = 0;
/* ⚠️ `timer = null` INSIDE THE CALLBACK IS THE WHOLE MECHANISM, and leaving it out is a
   LIE-CLASS BUG walked live on this page: a fired setTimeout leaves its handle truthy,
   so the `already armed at this cadence` guard saw a timer that had already run and
   returned without re-arming. The page polled ONCE and then went quietly stale — it
   kept showing a library and an engine state from minutes ago as if they were now.
   (Same defect and same fix as bridge/panel/comfy.html's arm(), found there in
   v1.5.41; doctrine 6b — the class is pinned by a test in test_compose_page.js.) */
function arm(ms) {
  if (timer && cadence === ms) return;
  cadence = ms;
  clearTimeout(timer);
  timer = setTimeout(() => { timer = null; load(); }, ms);
}

/* NOT alert(): the app shell's WKWebView has no runJavaScriptAlertPanel delegate, so
   alert() shows nothing there (v1.5.39). This toast renders in every host. */
let toastTimer = null;
function toast(msg, bad) {
  let t = $('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = bad ? 'bad' : '';
  t.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 9000);
}

/* ══ THE WORKBENCH: drag, dock, shrink — and the arrangement REMEMBERED ════════
   THE LIE THIS SECTION MUST NOT TELL: an arrangement that silently resets. A layout
   the user set by hand and finds undone after a reload is the same class of defect as
   a lost edit, so the layout is written on every change, read before the first paint,
   and is TOTAL about surprises — a saved id that no longer exists is skipped, a block
   the save never heard of keeps its markup position, and a block parked in the spill
   slot forces the pane back into its shrunk state, because restoring it into a hidden
   container would make the block vanish. */
const LAYOUT_KEY = 'compose-layout-v1';
const CONTAINERS = ['blocks', 'spill'];   /* the dock strip is reserved, never a target */
function readLayout() {
  try {
    const raw = localStorage.getItem(LAYOUT_KEY);
    if (!raw) return null;
    const j = JSON.parse(raw);
    return (j && typeof j === 'object') ? j : null;
  } catch (e) { return null; }
}
function saveLayout() {
  const out = { v:1, side:document.body.classList.contains('dock-right') ? 'right' : 'left',
                shrunk:document.body.classList.contains('shrunk') };
  CONTAINERS.forEach(id => {
    const c = $(id);
    out[id] = c && c.querySelectorAll
      ? Array.prototype.slice.call(c.querySelectorAll(':scope > .block'))
          .map(n => n.dataset.block).filter(Boolean)
      : [];
  });
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(out)); } catch (e) { /* private mode */ }
  return out;
}
function applyLayout() {
  const L = readLayout();
  if (!L) return;
  document.body.classList.toggle('dock-right', L.side === 'right');
  document.body.classList.toggle('dock-left', L.side !== 'right');
  CONTAINERS.forEach(id => {
    const c = $(id);
    if (!c || !c.appendChild) return;
    (L[id] || []).forEach(key => {
      const el = document.querySelector && document.querySelector('[data-block="' + key + '"]');
      if (el) c.appendChild(el);        // moving is idempotent; unknown keys are skipped
    });
  });
  const spill = $('spill');
  const parked = spill && spill.querySelectorAll
    ? spill.querySelectorAll(':scope > .block').length : 0;
  document.body.classList.toggle('shrunk', !!L.shrunk || parked > 0);
  syncShrinkLabel();
}
/* A restored shrunk pane whose button still offered to "Shrink to half height" was a
   control lying about its own state — small, and exactly the class this page bans. */
function syncShrinkLabel() {
  const b = $('shrink');
  if (!b || !b.setAttribute) return;
  const on = document.body.classList.contains('shrunk');
  b.title = on ? 'Restore full height' : 'Shrink to half height';
  b.setAttribute('aria-label', on ? 'Restore the settings pane' : 'Shrink the settings pane');
  b.setAttribute('aria-pressed', String(on));
}

/* FLIP — the only motion in the workbench, and it is the authored one: the slots
   really move under the pointer instead of teleporting (Emil: transitions, not
   keyframes, for anything retriggered; transform and opacity only). */
function flip(nodes, mutate, ms) {
  const reduce = (typeof matchMedia === 'function')
    && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const first = new Map();
  nodes.forEach(n => { if (n.getBoundingClientRect) first.set(n, n.getBoundingClientRect()); });
  mutate();
  if (reduce) return;
  nodes.forEach(n => {
    const a = first.get(n); if (!a || !n.getBoundingClientRect) return;
    const b = n.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    n.style.transition = 'none';
    n.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  });
  if (document.body.getBoundingClientRect) document.body.getBoundingClientRect();
  nodes.forEach(n => {
    const a = first.get(n); if (!a) return;
    n.style.transition = 'transform ' + (ms || 240) + 'ms cubic-bezier(0.23, 1, 0.32, 1)';
    n.style.transform = '';
  });
}
function siblings() {
  if (!document.querySelectorAll) return [];
  return Array.prototype.slice.call(document.querySelectorAll('#blocks > *, #spill > *'));
}
function wireWorkbench() {
  if (!document.addEventListener || !document.querySelector) return;
  let drag = null, moving = false;

  document.addEventListener('pointerdown', (e) => {
    if (e.button) return;
    if (!e.target.closest) return;
    if (e.target.closest('button,input,textarea,select,a')) return;
    const bar = e.target.closest('.block > .pbar.grab');
    if (!bar) return;
    const it = bar.parentNode;
    const r = it.getBoundingClientRect();
    drag = { it, dx:e.clientX - r.left, dy:e.clientY - r.top, ph:document.createElement('div') };
    drag.ph.className = 'block slot' + (it.classList.contains('w2') ? ' w2' : '');
    it.parentNode.insertBefore(drag.ph, it);
    it.classList.add('drag');
    it.style.cssText = 'position:fixed;pointer-events:none;z-index:60;width:' + r.width +
      'px;height:' + r.height + 'px;left:' + r.left + 'px;top:' + r.top + 'px';
    document.body.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('pointermove', (e) => {
    if (!drag) return;
    drag.it.style.left = (e.clientX - drag.dx) + 'px';
    drag.it.style.top = (e.clientY - drag.dy) + 'px';
    const under = document.elementFromPoint(e.clientX, e.clientY);
    if (!under || !under.closest) return;
    const over = under.closest('.block');
    const cont = under.closest('#blocks, #spill');
    const sibs = siblings();
    if (over && over !== drag.ph && over !== drag.it) {
      const rr = over.getBoundingClientRect();
      const after = (e.clientX - rr.left) > rr.width / 2;
      flip(sibs, () => over.parentNode.insertBefore(drag.ph, after ? over.nextSibling : over));
    } else if (cont && !cont.contains(drag.ph)) {
      flip(sibs, () => cont.appendChild(drag.ph));
    }
  });
  document.addEventListener('pointerup', () => {
    if (!drag) return;
    const it = drag.it;
    it.classList.remove('drag'); it.style.cssText = '';
    drag.ph.parentNode.replaceChild(it, drag.ph);
    document.body.classList.remove('dragging');
    drag = null;
    saveLayout();
    raf(paintHero);
  });

  /* the settings pane: grab its label bar and drop it on either edge */
  const grab = $('sgrab');
  const place = (e) => {
    const f = $('floater');
    if (f && f.style) { f.style.left = (e.clientX + 12) + 'px'; f.style.top = (e.clientY + 12) + 'px'; }
    const left = e.clientX < window.innerWidth / 2;
    const l = document.querySelector('#hints .l'), r = document.querySelector('#hints .r');
    if (l) l.classList.toggle('on', left);
    if (r) r.classList.toggle('on', !left);
  };
  const dock = (side) => {
    flip([$('scol'), $('work')].concat(siblings()).filter(Boolean), () => {
      document.body.classList.toggle('dock-right', side === 'right');
      document.body.classList.toggle('dock-left', side === 'left');
    }, 280);
    saveLayout();
    setTimeout(paintHero, 300);
  };
  if (grab && grab.addEventListener) {
    grab.addEventListener('pointerdown', (e) => {
      if (e.target.closest && e.target.closest('button')) return;
      moving = true; document.body.classList.add('moving', 'dragging');
      place(e); e.preventDefault();
    });
  }
  document.addEventListener('pointermove', (e) => { if (moving) place(e); });
  document.addEventListener('pointerup', (e) => {
    if (!moving) return;
    moving = false; document.body.classList.remove('moving', 'dragging');
    dock(e.clientX < window.innerWidth / 2 ? 'left' : 'right');
  });
  const side = $('side'), shrink = $('shrink');
  if (side && side.addEventListener) side.addEventListener('click', () =>
    dock(document.body.classList.contains('dock-right') ? 'left' : 'right'));
  if (shrink && shrink.addEventListener) shrink.addEventListener('click', function () {
    const spill = $('spill');
    const parked = spill && spill.querySelectorAll
      ? spill.querySelectorAll(':scope > .block').length : 0;
    if (document.body.classList.contains('shrunk') && parked) {
      /* Collapsing the spill slot with blocks in it would hide them: move them back
         to the grid first, so nothing can disappear behind a control. */
      const grid = $('blocks');
      Array.prototype.slice.call(spill.querySelectorAll(':scope > .block'))
        .forEach(n => grid.appendChild(n));
      toast('Moved that block back to the grid.');
    }
    document.body.classList.toggle('shrunk');
    syncShrinkLabel();
    saveLayout();
    setTimeout(paintHero, 180);
  });
}

/* ── input plumbing ─────────────────────────────────────────────────────────── */
function readForm() {
  if ($('f-prompt')) S.form.prompt = $('f-prompt').value;
  if ($('f-lyrics')) S.form.lyrics = $('f-lyrics').value;
  if ($('f-steps'))  S.form.steps = $('f-steps').value.trim();
  if ($('f-seed'))   S.form.seed = $('f-seed').value.trim();
  if ($('f-fmt'))    S.form.format = $('f-fmt').value;
  if ($('f-secs'))   S.form.seconds = Number($('f-secs').value);
}
document.addEventListener('input', (e) => {
  const id = e.target && e.target.id;
  if (id === 'dir-inp') { S.dirValue = e.target.value; return; }
  if (!id || id.indexOf('f-') !== 0) return;
  readForm();
  if (id === 'f-prompt' || id === 'f-lyrics') {
    autogrow(e.target);                 /* grows DOWN; the column never gets wider */
    const pc = $('pcount');
    if (id === 'f-prompt' && pc) pc.textContent = (S.form.prompt || '').length
      ? String((S.form.prompt || '').length) : '';
    return;
  }
  /* The length chip follows the slider WITHOUT a re-render — rebuilding the composer
     on every drag would fight the thumb the user is holding. */
  if (id === 'f-secs') {
    const c = $('lenchip');
    const v = lengthVerdict(S.form.seconds);
    if (c) { c.textContent = v.chip; tipBind(c, tipHtml(v), tipPlain(v)); }
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { tipHide(); if (S.sheet) { S.sheet = false; render(); } }
  /* ⌘⏎ / Ctrl+⏎ composes from anywhere — the shortcut the button advertises. */
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
    const go = $('go');
    if (go && !go.disabled) { e.preventDefault(); startRender(false); }
  }
}, true);
window.addEventListener('scroll', () => tipHide(), true);
window.addEventListener('resize', () => { tipHide(); raf(paintHero); }, true);

/* Two-step arming for the irreversible ones (delete): a rendered song cannot be made
   again by accident, so the first press only asks. The same grammar the panel uses. */
function armed(btn, label) {
  if (btn._armed) { btn._armed = false; btn.classList.remove('arm'); btn.textContent = label; return true; }
  btn._armed = true; btn.classList.add('arm'); btn.textContent = 'sure?';
  setTimeout(() => { if (btn._armed) { btn._armed = false; btn.classList.remove('arm');
                                       btn.textContent = label; } }, 3000);
  return false;
}

/* After a field is COMMITTED (a name saved, a folder set) the caret is released, so the
   typing guard above stops holding the sheet and the very next render shows the truth. */
function blurCommitted() {
  const a = document.activeElement;
  if (a && a.blur && /^(INPUT|TEXTAREA)$/.test(a.tagName || '')) a.blur();
}

async function startRender(confirm) {
  readForm();
  const e = current();
  if (!e) { toast('There is no engine on disk yet.', true); return; }
  if (!(S.form.prompt || '').trim()) { toast('Describe the music first.', true); return; }
  const body = { engine:e.engine, prompt:S.form.prompt, lyrics:S.form.lyrics || '',
                 seconds:secondsNow(), steps:S.form.steps || '', seed:S.form.seed || '',
                 format:S.form.format || '' };
  if (confirm) body.confirm = true;
  S.busy = true; S.jobErr = ''; if (!confirm) S.warn = '';
  render();
  /* ⚠️ ECHO OF THE LOFFICE STUCK-LATCH BUG (2026-08-29, doctrine 6b). `api()` does NOT
     wrap its fetch, so a bridge that is down rejects out of this function — and with no
     catch here, `S.busy` stayed true for the rest of the session: Compose disabled,
     reading "Starting…", for ever. A rejection is an ANSWER now, in the same inline row
     every other start failure already uses. */
  let r = null;
  try { r = await api('/api/music/generate', { method:'POST', body:JSON.stringify(body) }); }
  catch (e) { r = { ok:false, error:'the bridge could not be reached: '
                                    + ((e && e.message) || e) }; }
  S.busy = false;
  if (!r.ok) {
    /* A RAM warning is not an error: it goes to the advisory row with a way through.
       Everything else surfaces inline, in the bridge's own words. */
    if (r.needs_confirm) { S.warn = r.error || 'that render may not fit'; S.jobErr = ''; }
    else { S.jobErr = r.error || 'the render could not start'; S.warn = ''; }
    render();
    return;
  }
  S.warn = '';
  await load();
}

document.addEventListener('click', async (e) => {
  if (!e.target.closest) return;
  if (!e.target.closest('.tipped') && !e.target.closest('#tip')) tipHide();
  if (e.target.id === 'scrim') { S.sheet = false; render(); return; }
  /* the transport lives on the ONE audio element; it is not a data-act */
  if (e.target.closest('#play')) {
    if (!_audio) return;
    if (_audio.paused) { _audio.play().catch(() => toast('That track could not be played.', true)); }
    else _audio.pause();
    return;
  }
  const cv = e.target.closest && e.target.closest('#bigwave');
  if (cv) {
    const r = cv.getBoundingClientRect();
    const dur = heroDuration();
    if (_audio && dur) {
      const to = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * dur;
      try { _audio.currentTime = to; } catch (err) { /* not seekable yet */ }
      S.pos = to; onTime();
    }
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;

  if (act === 'engines')      { readForm(); S.sheet = 'engines'; render(); }
  else if (act === 'presets') { readForm(); S.sheet = 'presets'; render(); }
  else if (act === 'close-sheet') { S.sheet = null; S.detail = null; render(); }
  else if (act === 'more')    { readForm(); S.more = !S.more; render(); }
  else if (act === 'all')     { S.all = !S.all; render(); }
  else if (act === 'lyrics')  { readForm(); S.lyricsOpen = true; render();
                                const l = $('f-lyrics'); if (l && l.focus) l.focus(); }
  else if (act === 'select')  { S.sel = b.dataset.name; render(); }
  else if (act === 'open-track') { S.detail = b.dataset.name; S.sheet = 'track'; render(); }
  else if (act === 'pick-engine') { S.form.engine = b.dataset.pick; render(); }
  else if (act === 'use-prompt') {
    const t = tracks().find(x => x.name === b.dataset.name);
    if (!t) return;
    S.form.prompt = t.prompt || '';
    render();
    toast('Loaded that prompt.');
  }
  else if (act === 'reuse-seed') {
    S.form.seed = String(b.dataset.seed); S.more = true; render();
    toast('Seed ' + b.dataset.seed + ' is in the seed field.');
  }
  else if (act === 'reuse') {
    /* THE REPLICATION AFFORDANCE. Everything that made a song is in its sidecar, so
       "another one like that" is one click plus an edit — the whole reason seeds and
       steps are recorded at all. */
    const t = tracks().find(x => x.name === b.dataset.name);
    if (!t) return;
    if (t.engine && installed().some(x => x.engine === t.engine)) S.form.engine = t.engine;
    S.form.prompt = t.prompt || '';
    S.form.lyrics = t.lyrics || '';
    if (t.lyrics) S.lyricsOpen = true;
    if (t.seconds) S.form.seconds = Number(t.seconds);
    S.form.steps = t.steps == null ? '' : String(t.steps);
    S.form.seed = t.seed == null ? '' : String(t.seed);
    S.more = true; S.sheet = null; S.detail = null;
    render();
    toast('Loaded the settings from “' + titleOf(t) + '”.');
  }
  else if (act === 'save-title') {
    const el = $('t-title');
    const r = await api('/api/music/title', { method:'POST',
      body:JSON.stringify({ name:b.dataset.name, title:(el && el.value) || '' }) });
    if (!r.ok) { toast(r.error || 'could not save that name', true); return; }
    blurCommitted();
    S.lib = r.tracks || S.lib;
    render();
    toast((el && el.value.trim()) ? 'Named “' + el.value.trim() + '”.'
                                  : 'That track has no name of its own again.');
  }
  else if (act === 'convert') {
    b.disabled = true;
    const r = await api('/api/music/convert', { method:'POST',
      body:JSON.stringify({ name:b.dataset.name, fmt:b.dataset.fmt }) });
    b.disabled = false;
    if (!r.ok) { toast(r.error || 'the conversion failed', true); return; }
    toast('Wrote ' + (r.name || b.dataset.fmt) + '.');
    await load();
  }
  else if (act === 'reveal') {
    const t = tracks().find(x => x.name === b.dataset.name);
    if (!t) return;
    const r = await api('/api/open', { method:'POST',
      body:JSON.stringify({ path:t.path, action:'reveal' }) });
    /* /api/open answers with `log`, not `error`, when it refuses — read both or a
       real refusal ("path does not exist") would show as "undefined". */
    if (r && r.ok === false) toast(r.error || r.log || 'could not show that file', true);
  }
  else if (act === 'reveal-dir') {
    const r = await api('/api/open', { method:'POST',
      body:JSON.stringify({ path:(S.st || {}).dir || '', action:'reveal' }) });
    if (r && r.ok === false) toast(r.error || r.log || 'could not open that folder', true);
  }
  else if (act === 'edit-dir') {
    /* A TYPED PATH, NOT A PICKER: WKWebView has no folder picker (the recorded
       silent-no-op class), which is why the voice lane types paths too. The editor is
       STATE, so a poll that redraws the sheet cannot close it under the user. */
    S.dirEdit = true; S.dirValue = (S.st || {}).dir || '';
    render();
    const i = $('dir-inp'); if (i && i.focus) i.focus();
  }
  else if (act === 'cancel-dir') { S.dirEdit = false; S.dirValue = null; render(); }
  else if (act === 'set-dir') {
    const v = ($('dir-inp') || {}).value || S.dirValue || '';
    const r = await api('/api/music/settings', { method:'POST',
      body:JSON.stringify({ output_dir:v }) });
    if (!r.ok) { toast(r.error || 'could not set that folder', true); return; }
    blurCommitted();
    S.dirEdit = false; S.dirValue = null;
    S.sel = null;                  /* a different folder is a different library */
    toast('Tracks are saved to ' + (r.output_dir || 'the default') + '.');
    await load();
  }
  else if (act === 'delete') {
    if (!armed(b, 'Delete')) return;
    b.disabled = true;
    const r = await api('/api/music/delete', { method:'POST',
      body:JSON.stringify({ name:b.dataset.name }) });
    b.disabled = false;
    if (!r.ok) { toast(r.error || 'could not delete that track', true); return; }
    if (S.sel === b.dataset.name) S.sel = null;
    delete S.wave[b.dataset.name];
    S.sheet = null; S.detail = null;
    await load();
  }
  else if (act === 'install') {
    b.disabled = true;
    const r = await api('/api/music/install', { method:'POST',
      body:JSON.stringify({ engine:b.dataset.pick }) });
    b.disabled = false;
    if (!r.ok) { toast(r.error || 'could not start that install', true); return; }
    toast('Installing ' + b.dataset.pick + ' — several GB; you can leave this tab.');
    await load();
  }
  else if (act === 'use-preset') {
    const t = (((S.st || {}).templates) || []).find(x => x.id === b.dataset.id);
    if (!t) return;
    if (t.engine_hint && installed().some(x => x.engine === t.engine_hint))
      S.form.engine = t.engine_hint;
    S.form.prompt = t.prompt || '';
    S.form.lyrics = t.lyrics || '';
    if (t.lyrics) S.lyricsOpen = true;
    if (t.seconds) S.form.seconds = Number(t.seconds);
    if (t.steps != null) S.form.steps = String(t.steps);
    S.sheet = null;
    render();
    toast('Loaded the “' + t.name + '” preset.');
  }
  else if (act === 'save-preset') {
    readForm();
    const name = (S.form.prompt || '').trim().split(/\s+/).slice(0, 4).join(' ');
    if (!name) { toast('Describe the music first — a preset needs something to save.', true); return; }
    const r = await api('/api/music/templates', { method:'POST',
      body:JSON.stringify({ name, prompt:S.form.prompt, lyrics:S.form.lyrics || '',
                            seconds:secondsNow(), steps:S.form.steps || '',
                            engine:S.form.engine }) });
    if (!r.ok) { toast(r.error || 'could not save that preset', true); return; }
    if (S.st) S.st.templates = r.templates || S.st.templates;
    render();
    toast('Saved “' + name + '”.');
  }
  else if (act === 'forget-preset') {
    if (!armed(b, '✕')) return;
    const r = await api('/api/music/templates/delete', { method:'POST',
      body:JSON.stringify({ id:b.dataset.id }) });
    if (r.ok && S.st) S.st.templates = r.templates || [];
    render();
  }
  else if (act === 'stop') {
    if (!armed(b, 'Stop')) return;
    b.disabled = true;
    const r = await api('/api/music/cancel', { method:'POST', body:'{}' });
    b.disabled = false;
    if (!r.ok) { toast(r.error || 'could not stop the render', true); return; }
    await load();
  }
  else if (act === 'dismiss-warn') { S.warn = ''; render(); }
  else if (act === 'go')           { await startRender(false); }
  else if (act === 'go-anyway')    { await startRender(true); }
});

applyLayout();
wireWorkbench();
load();
</script>
</body>
</html>
