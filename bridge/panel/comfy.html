  return HUES[h % HUES.length];
}

/* ══ DEBI'S STAGE: RESIZE + SPLIT, PERSISTED ═══════════════════════════════════
   Both are view state, so both live in one localStorage key of our own. The page
   still NEVER writes the panel's three appearance keys — this is not one of them. */
const VIEW_KEY = 'motdeck-comfy-view';
function clampFrac(v) {
  v = Number(v);
  if (!isFinite(v)) return 0.58;
  return Math.min(0.82, Math.max(0.22, v));
}
function loadView() {
  try {
    const raw = localStorage.getItem(VIEW_KEY);
    if (!raw) return;
    const j = JSON.parse(raw);
    if (SPLITS.indexOf(Number(j.split)) >= 0) S.split = Number(j.split);
    if (j.stagef != null) { S.stagef = clampFrac(j.stagef); S.sized = j.sized !== false; }
    if (Array.isArray(j.panes)) {
      for (let i = 0; i < 4; i++) S.panes[i] = j.panes[i] || null;
    }
    if (j.adv === true) S.adv = true;
    if (j.railw != null) S.railw = clampW(j.railw, RAIL_MIN, RAIL_MAX, 208);
    if (j.resw != null) S.resw = clampW(j.resw, RES_MIN, RES_MAX, 224);
    if (j.model) S.form.model = j.model;
    if (j.workflow) S.form.workflow = j.workflow;
  } catch (e) { /* private mode or a corrupt value: the defaults stand, silently */ }
}
/* the rails' clamp, same shape as clampFrac: a corrupt stored width falls back to the
   default rather than to NaN, which would collapse the column to nothing */
function clampW(v, lo, hi, dflt) {
  v = Number(v);
  if (!isFinite(v)) return dflt;
  return Math.min(hi, Math.max(lo, Math.round(v)));
}
function saveView() {
  try {
    localStorage.setItem(VIEW_KEY, JSON.stringify(
      { split:S.split, stagef:S.stagef, sized:S.sized, panes:S.panes, adv:S.adv,
        railw:S.railw, resw:S.resw,
        /* the model and workflow you left on are part of the view: coming back to
           somebody else's default is the small daily annoyance this key exists for */
        model:S.form.model || null, workflow:S.form.workflow || null }));
  } catch (e) { /* nothing here depends on persistence succeeding */ }
}
function setVar(el, name, val) {
  if (el && el.style && typeof el.style.setProperty === 'function')
    el.style.setProperty(name, val);
}
/* ⚠️ AN UNASSIGNED PANE FOLLOWS THE LATEST RESULT; A PINNED ONE HOLDS ITS OWN. Both
   halves are walked defects (2026-08-29). Pinning on every render meant a finished run
   left the OLD picture on the stage — the pane had re-pinned itself to the previous
   newest while the job was still running. Never pinning meant promoting a different
   pane blanked the one you had been looking at. So the pin happens at exactly the two
   moments that would otherwise lose a picture: when you leave a pane, and when the
   stage splits. */
function pinCurrent() {
  if (S.panes[S.pane]) return;
  const cur = selected();
  if (cur) S.panes[S.pane] = cur.filename;
}
function setSplit(n) {
  n = Number(n);
  if (SPLITS.indexOf(n) < 0) return;
  if (n > S.split) {
    pinCurrent();
    /* SPLITTING FILLS THE NEW PANES WITH THE MOST RECENT RESULTS THAT ARE NOT ALREADY
       ON SCREEN. Splitting into four empty boxes would make the user do four clicks to
       see what the feature is for; filling them is real data, in the order the gallery
       already has, and any pane is one click from something else. Panes stay empty only
       when the gallery genuinely has nothing more to show. */
    const used = {};
    S.panes.slice(0, n).forEach(f => { if (f) used[f] = 1; });
    const pool = items().filter(it => !used[it.filename]);
    let k = 0;
    for (let i = 0; i < n; i++) {
      if (S.panes[i]) continue;
      const it = pool[k++];
      if (it) S.panes[i] = it.filename;
    }
  }
  S.split = n;
  /* COLLAPSING KEEPS WHAT YOU WERE LOOKING AT. Going 4 → 1 while the third pane is the
     current one used to show pane ONE's picture: the layout changed and so did the
     subject, which is the small lie of "your click did something else". The two panes
     swap, so nothing is lost either. */
  if (S.pane >= n) {
    const keep = S.panes[S.pane];
    S.panes[S.pane] = S.panes[0];
    S.panes[0] = keep;
    if (keep) S.sel = keep;
    S.pane = 0;
  }
  saveView();
  render();
}
/* PURE: what is on pane i right now. A pane holding a filename that has since left the
   gallery renders EMPTY rather than keeping a picture that is no longer on disk. */
function paneItem(i) {
  const fn = S.panes[i];
  if (fn) { const it = itemBy(fn); if (it) return it; }
  if (i === S.pane) return selected();
  return null;
}
function stageItem() { return paneItem(S.pane) || selected(); }
function assign(fn) {                       /* a thumbnail lands in the CURRENT pane */
  S.sel = fn;
  S.panes[S.pane] = fn;
  saveView();
}

/* ── ③ the stage ────────────────────────────────────────────────────────────── */
function mediaHtml(it) {
  if (!it) return '';
  const src = fileSrc(it);
  if (it.state === 'missing') return '<span class="chip c-bad">file is gone</span>';
  if (it.kind === 'video')
    return '<video src="' + src + '" controls loop muted playsinline preload="metadata"></video>';
  if (it.kind === 'image') return '<img src="' + src + '" alt="">';
  return '<span class="chip c-dim">' + esc(it.kind) + '</span>';
}
function renderStage() {
  /* while a pane is filling the screen its element is mid-FLIP: repainting the stage
     under it would replace the very node being animated */
  if (S.full) return;
  const stage = $('stage');
  const job = liveJob();

  /* FIRST RUN (Debi's fork answer 4): the composer stays the product's face and the
     stage hosts the invitation with the two sized Get buttons. */
  if (!usablePicks().length && !job) {
    /* image first: the still is the shorter, cheaper, more certain first success, and
       it is the one the video model was measured to be bad at. */
    const st = picks().filter(c => c.starter)
      .sort((a, b) => (a.role === 'image' ? 0 : 1) - (b.role === 'image' ? 0 : 1));
    stage.className = 'empty';
    paint('stage-body',
      '<div id="stage-invite">' +
        '<h2 class="say invite">Turn a sentence into a picture or a clip — on this Mac, offline.</h2>' +
        '<div class="row" style="justify-content:center;padding-top:10px">' +
        /* the licence rides ON the button's hover — never as a third control beside it */
        st.map(c => '<button class="primary" data-act="download" data-pick="' + esc(c.id) + '"' +
          tipRef(inviteVerdict(c)) + '>' +
          esc(c.role === 'video' ? 'Get the video model' : 'Get the image model') +
          ' · ' + esc(c.total_h) + '</button>').join('') +
        '</div>' +
        '<p class="say" style="padding-top:8px">Nothing downloads until you press. Every size is exact.</p>' +
      '</div>');
    wireTips($('stage-body'));
    return;
  }

  if (!items().length) {
    stage.className = 'empty';
    paint('stage-body', '<p class="say">What you make lands here and stays.</p>');
    return;
  }

  stage.className = '';
  const n = S.split;
  let html = '<div id="panes" class="s' + n + '">';
  for (let i = 0; i < n; i++) {
    const it = paneItem(i);
    const cur = i === S.pane;
    html += '<div class="pane" role="button" tabindex="0" data-act="pane" data-i="' + i +
      '" aria-current="' + (cur ? 'true' : 'false') + '"' +
      (it ? ' data-fn="' + esc(it.filename) + '" style="--sel:var(' +
            hueFor(it.pick) + ')"' : '') +
      ' aria-label="' + (it ? 'Result ' + esc(it.filename) : 'Empty pane') + '">' +
      (it ? mediaHtml(it) +
            '<div class="pcap">' +
              '<span class="chip c-dim">' + esc(it.pick_title || '—') + '</span>' +
              (it.shape ? '<span class="chip c-dim num">' + esc(it.shape) + '</span>' : '') +
            '</div>'
          : '<div class="pempty"><span class="chip c-dim">empty pane</span></div>') +
      '</div>';
  }
  html += '</div>';
  paint('stage-body', html);
}

/* ── the caption chips under the stage (the Pixelmator write-back's other half) ── */
function renderCaps() {
  const it = stageItem();
  if (!it) { paint('caps', ''); return; }
  const iv = itemVerdict(it);
  /* WHAT LIVES WHERE, so one fact is never printed three times: the picture's own
     caption (on hover) names the model and the size, the results rail lists every
     recorded fact, and THIS row is the actions — reuse the seed, reveal the file, and
     the ⋯ that holds the graph. */
  paint('caps',
    (it.seed != null ? '<span class="chip c-dim act" data-act="reuse-seed" data-seed="' +
        esc(it.seed) + '"' + tipRef({ chip:'seed', line:'The seed this run drew.',
          math:String(it.seed),
          hedge:'Click to put it back in the seed field. The field itself resets to '
              + 'random after every run, on purpose.' }) + '>seed ' + esc(it.seed) + '</span>' : '') +
    (it.wall_s != null ? chipHtml({ chip:secs(it.wall_s), cls:'c-dim',
        line:'Wall time of this run.', hedge:'Measured here, never estimated.' }) : '') +
    (it.peak_bytes ? chipHtml({ chip:'peak ' + gb(it.peak_bytes), cls:'c-dim',
        line:'Peak phys_footprint of the ComfyUI process during this run.',
        hedge:'Measured, not predicted.' }) : '') +
    (it.size_h ? chipHtml({ chip:it.size_h, cls:'c-dim', line:'What it takes on disk.',
        math:it.filename || '', hedge:'Kept forever; delete in Finder via Reveal.' }) : '') +
    (iv ? chipHtml(iv) : '') +
    '<span class="grow"></span>' +
    '<button class="ghost" data-act="reveal" data-fn="' + esc(it.filename) +
      '" data-sf="' + esc(it.subfolder || '') + '">Reveal</button>' +
    '<button class="ghost ovf" data-act="item-menu" data-fn="' + esc(it.filename) +
      '" data-sf="' + esc(it.subfolder || '') + '" data-job="' + esc(it.job || '') +
      '" data-graph="' + (it.graph_available ? '1' : '') +
      '" aria-label="More actions">⋯</button>');
  wireTips($('caps'));
}

/* ── ④ the results rail ─────────────────────────────────────────────────────── */
function renderResults() {
  const list = items();
  const g = S.gallery || {};
  const st = stageItem();
  /* "0 items · nothing" is arithmetic, not English — an empty gallery says so plainly */
  const tot = { chip:list.length
                  ? (list.length + ' · ' + (g.total_h || '0'))
                  : 'nothing kept yet', cls:'c-dim',
                line:'Everything is kept — nothing here is ever deleted automatically.',
                math:g.output_dir || '',
                hedge:'Pruning is deliberate: Reveal an item and delete it in Finder.' };
  $('rc').innerHTML = chipHtml(tot);
  wireTips($('rc'));

  paint('thumbs', list.map(it => {
    const src = fileSrc(it);
    /* ⚠️ `#t=0.1` IS THE REST OF DEBI'S BLACK-BAR FIX. `preload="metadata"` fetches the
       duration and decodes NO frame, so a clip's thumbnail was a black rectangle until
       something made it seek. The media fragment asks for one frame at 0.1s, which is
       what every video-first gallery does and what makes a clip look like the clip. */
    const inner = it.state === 'missing' ? '' :
      (it.kind === 'video'
        ? '<video src="' + src + '#t=0.1" muted playsinline preload="metadata"></video>'
       : it.kind === 'image' ? '<img src="' + src + '" loading="lazy" alt="">' : '');
    return '<button class="thumb ' +
      (it.state === 'missing' ? 'gone' : it.state === 'ok' ? '' : 'bad') +
      '" data-act="select" data-fn="' + esc(it.filename) +
      '" aria-current="' + (st && st.filename === it.filename ? 'true' : 'false') +
      '" style="--sel:var(' + hueFor(it.pick) + ')" title="' +
      esc((it.prompt || it.filename).slice(0, 120)) + '">' + inner +
      '<i style="background:var(' + hueFor(it.pick) + ')"></i></button>';
  }).join(''));

  /* THE SELECTED RESULT, AS FACTS. Every row is present only if the record has it —
     a missing seed is an absent row, never a dash pretending to be a value. */
  const kv = (k, v, tip) => v == null || v === '' ? '' :
    '<div class="kv"' + (tip ? tipRef(tip) : '') + '><span>' + esc(k) +
    '</span><b class="num">' + esc(v) + '</b></div>';
  paint('rmeta', st
    ? kv('Model', st.pick_title) + kv('Size', st.shape) + kv('Steps', st.steps) +
      kv('Seed', st.seed) + kv('Time', st.wall_s == null ? null : secs(st.wall_s)) +
      kv('Peak', st.peak_bytes == null ? null : gb(st.peak_bytes)) +
      kv('On disk', st.size_h)
    : '');

  /* THE HUE LEGEND — counted off the REAL gallery, so it says what actually made what.
     No models section at all when the gallery is empty. */
  const by = {};
  list.forEach(it => {
    const k = it.pick || '';
    by[k] = by[k] || { n:0, title:it.pick_title || it.pick || 'unknown' };
    by[k].n++;
  });
  const keys = Object.keys(by);
  paint('mlegend', keys.length
    ? '<div class="caps" style="padding-top:6px">Models here</div>' +
      keys.map(k => '<div class="kv"><span style="display:flex;align-items:center;gap:6px">' +
        '<i class="famdot" style="background:var(' + hueFor(k) + ')"></i>' +
        esc(by[k].title) + '</span><b class="num">' + by[k].n + '</b></div>').join('')
    : '');
  wireTips($('thumbs'));
  wireTips($('rmeta'));
}

/* ── ② the settings rail ────────────────────────────────────────────────────── */
const ADV_KEYS = ['seed', 'negative'];
function advDirty() {
  const f = S.form, c = currentPick();
  if (f.seed != null && f.seed !== '') return true;
  if (c && f.negative != null && f.negative !== c.negative_default) return true;
  return false;
}
function srow(label, id, val, tip) {
  return '<div class="srow"><label for="' + id + '"' + (tip ? tipRef(tip) : '') + '>' +
    esc(label) + '</label><input id="' + id + '" inputmode="numeric" value="' +
    esc(val == null ? '' : val) + '"></div>';
}
/* ⚠️ ONE SELECTION, ONE MODE. With the picker in charge, `mode` is no longer a free
   variable: a discovered workflow's kind IS its mode, and a curated one may only be
   asked for a mode its own graph has. Letting the old mode survive a workflow change
   was how the page could offer "Clip" while pointed at an image-only template — the
   submit would then be refused by the bridge for a reason the user never chose. */
function syncMode() {
  const w = curWorkflow();
  if (!w) return;
  const c = wfCurated(w);
  if (!c) { S.form.mode = w.kind; return; }
  if (!(c.modes || []).includes(S.form.mode))
    S.form.mode = (c.modes || []).includes(w.kind) ? w.kind : (c.modes || [])[0];
}
function renderRail() {
  const allModes = modesAvailable();
  if (catModels().length) syncMode();
  else if (!allModes.includes(S.form.mode)) S.form.mode = allModes[0];
  const f = S.form;
  const c = currentPick();
  if (c && S.form.pick !== c.id) S.form.pick = c.id;
  const mv = modelVerdict(c, f.mode, c ? dlFor(c.id) : null);
  const meas = c ? measuredVerdict(c, f.mode) : null;
  const d = (c && (c.defaults || {})[f.mode]) || {};
  const job = liveJob();
  const jobs = (S.state && S.state.jobs) || [];

  const wf = curWorkflow();
  const dyn = wf && !wfCurated(wf);

  let h = '';
  /* MODEL — the hue of the family, then the model chip that opens the sheet.
     ⚠️ IT IS DROPPED WHEN THE CATALOGUE IS DRIVING, and that is the one-verdict-object
     rule rather than tidiness: the picker below the prompt already names the model, its
     workflow and its state. A second chip bound to the same choice is exactly the pair
     that can disagree. The MODE segment goes with it — a discovered workflow's kind IS
     the workflow you picked, so the toggle would be a control with nothing to say. */
  if (!catModels().length) {
    h += '<div class="sgroup"><span class="caps">' +
      '<i class="famdot" style="background:var(--h6)"></i>Model</span>' +
      '<div class="srow wide">' +
        '<span class="chip act ' + esc(mv.cls) + '" data-act="sheet"' + tipRef(mv) + '>' +
        esc(mv.chip) + '</span></div>' +
      (meas && meas.unmeasured && c ? '<div class="srow wide">' + chipHtml(meas) + '</div>' : '') +
      '<div class="srow"><label>Mode</label><span class="seg" id="f-mode">' +
        allModes.map(m => '<button data-mode="' + m + '" class="' +
          (m === f.mode ? 'on' : '') + '">' + (m === 'image' ? 'Image' : 'Clip') +
          '</button>').join('') + '</span></div>' +
    '</div>';
  } else if (c && (c.modes || []).length > 1) {
    /* the one case a MODE still exists: a curated model whose own graph does two
       things (Wan's t2v graph emits a single frame at length 1). That is a choice
       inside one workflow, so it stays a control inside the settings. */
    h += '<div class="sgroup"><span class="caps">' +
      '<i class="famdot" style="background:var(--h6)"></i>Mode</span>' +
      '<div class="srow"><label>Output</label><span class="seg" id="f-mode">' +
        allModes.map(m => '<button data-mode="' + m + '" class="' +
          (m === f.mode ? 'on' : '') + '">' + (m === 'image' ? 'Image' : 'Clip') +
          '</button>').join('') + '</span></div>' +
      (meas && meas.unmeasured ? '<div class="srow wide">' + chipHtml(meas) + '</div>' : '') +
    '</div>';
  }

  if (dyn) {
    /* ── A DISCOVERED WORKFLOW'S OWN CONTROLS ──────────────────────────────────
       Only the knobs the CONVERTED GRAPH actually carries, prefilled from the values
       the template itself ships with. A workflow with no negative prompt shows no
       negative prompt; one that makes stills shows no frame count. Both facts are read
       off the graph by the bridge — there is no table of "video models have frames"
       here to go stale. */
    const sizeRows =
      (wfHas(wf, 'width') ? srow('Width', 'f-width',
         f.width != null ? f.width : wfDefault(wf, 'width')) : '') +
      (wfHas(wf, 'height') ? srow('Height', 'f-height',
         f.height != null ? f.height : wfDefault(wf, 'height')) : '') +
      (wfHas(wf, 'length') ? srow('Frames', 'f-frames',
         f.frames != null ? f.frames : wfDefault(wf, 'length'),
         { chip:'frames', line:'Frame counts snap to 4n+1.',
           hedge:'These latents move four frames at a time. The number actually used '
               + 'is written back here after the run.' }) : '') +
      (wfHas(wf, 'fps') ? srow('FPS', 'f-fps',
         f.fps != null ? f.fps : wfDefault(wf, 'fps')) : '');
    if (sizeRows) {
      h += '<div class="sgroup"><span class="caps">' +
        '<i class="famdot" style="background:var(--h2)"></i>Size</span>' + sizeRows +
      '</div>';
    }
    const sampRows =
      (wfHas(wf, 'steps') ? srow('Steps', 'f-steps',
         f.steps != null ? f.steps : wfDefault(wf, 'steps')) : '') +
      (wfHas(wf, 'cfg') ? srow('CFG', 'f-cfg',
         f.cfg != null ? f.cfg : wfDefault(wf, 'cfg')) : '') +
      (wfHas(wf, 'seed') ? '<div class="srow adv"><label for="f-seed">Seed</label>' +
         '<input id="f-seed" placeholder="random" value="' +
         esc(f.seed == null ? '' : f.seed) + '"></div>' : '');
    if (sampRows) {
      h += '<div class="sgroup"><span class="caps">' +
        '<i class="famdot" style="background:var(--h1)"></i>Sampling</span>' + sampRows +
      '</div>';
    }
    if (wfHas(wf, 'negative')) {
      h += '<div class="sgroup adv"><span class="caps">' +
        '<i class="famdot" style="background:var(--h5)"></i>Negative</span>' +
        '<div class="srow wide"><textarea id="f-neg" rows="2">' +
        esc(f.negative != null ? f.negative : (wfDefault(wf, 'negative') || '')) +
        '</textarea></div></div>';
    }
    /* THE FILE LIST OF THIS WORKFLOW — its own, not the family's. Debi's bullet 2:
       "each workflow row knows its OWN required files … state present/absent per file
       with sizes". Present rows are quiet; the ones that are not are the whole point. */
    h += '<div class="sgroup"><span class="caps">' +
      '<i class="famdot" style="background:var(--h4)"></i>Files</span>' +
      (wf.files || []).map(fl => '<div class="erow">' +
        '<span class="sw" style="background:var(' +
          (fl.present ? '--h2' : '--h4') + ')"></span>' +
        '<span class="n">' + esc(fl.name) + '<small>' + esc(fl.directory) +
          (fl.bytes != null ? ' · ' + gb(fl.bytes) : '') + '</small></span>' +
        chipHtml({ chip:(fl.present ? 'here' : fl.state === 'partial' ? 'partly here'
                                              : 'missing'),
                   cls:fl.present ? 'c-ok' : fl.state === 'partial' ? 'c-gold' : 'c-warn',
                   line:(fl.present ? 'On disk at ' + gb(fl.bytes) + '.'
                         : fl.state === 'partial' ? 'Partly downloaded; Get resumes it.'
                         : 'Not downloaded yet.'),
                   math:'models/' + fl.directory + '/',
                   hedge:(fl.present ? 'Shared with the ComfyUI tab: one copy, both '
                                     + 'surfaces. Delete it there and this row changes.'
                          : fl.url ? (fl.bytes != null
                              ? 'Size HEAD-verified against the URL upstream published.'
                              : 'No size has come back from a HEAD request yet, so none '
                                + 'is shown.')
                                   : 'Upstream publishes no download link for this file.') }) +
      '</div>').join('') +
    '</div>';
  }

  if (c && !dyn) {
    /* SIZE — the real defaults of the real template for the real mode */
    h += '<div class="sgroup"><span class="caps">' +
      '<i class="famdot" style="background:var(--h2)"></i>Size</span>' +
      srow('Width', 'f-width', f.width != null ? f.width : d.width) +
      srow('Height', 'f-height', f.height != null ? f.height : d.height) +
      (f.mode === 'video'
        ? srow('Frames', 'f-frames', f.frames != null ? f.frames : d.frames,
               { chip:'frames', line:'Frame counts snap to 4n+1.',
                 hedge:'This model’s latents move four frames at a time. The number '
                     + 'actually used is written back here after the run.' }) +
          srow('FPS', 'f-fps', f.fps != null ? f.fps : d.fps)
        : '') +
    '</div>';

    /* SAMPLING — steps always, seed behind the gate */
    h += '<div class="sgroup"><span class="caps">' +
      '<i class="famdot" style="background:var(--h1)"></i>Sampling</span>' +
      srow('Steps', 'f-steps', f.steps != null ? f.steps : d.steps) +
      '<div class="srow adv"><label for="f-seed">Seed</label>' +
        '<input id="f-seed" placeholder="random" value="' +
        esc(f.seed == null ? '' : f.seed) + '"></div>' +
    '</div>';

    /* NEGATIVE — one control, behind the gate, because it is rarely touched */
    h += '<div class="sgroup adv"><span class="caps">' +
      '<i class="famdot" style="background:var(--h5)"></i>Negative</span>' +
      '<div class="srow wide"><textarea id="f-neg" rows="2">' +
      esc(f.negative != null ? f.negative : c.negative_default) + '</textarea></div>' +
    '</div>';
  }

  /* ON DISK — the real curated models, their real sizes, their real last measurement,
     and their real download state chip (the same object the sheet's row uses). */
  const ps = picks();
  if (ps.length) {
    h += '<div class="sgroup"><span class="caps">' +
      '<i class="famdot" style="background:var(--h4)"></i>On disk</span>' +
      ps.map(p => {
        const sv = stateVerdict(p, dlFor(p.id));
        const m = (p.measured || {})[p.role] || (p.measured || {})[p.modes[0]] || null;
        return '<div class="erow">' +
          '<span class="sw" style="background:var(' + hueFor(p.id) + ')"></span>' +
          '<span class="n">' + esc(p.title) + '<small>' + esc(p.total_h) +
            (m ? ' · last ' + esc(secs(m.wall_s)) : '') + '</small></span>' +
          '<span class="chip ' + esc(sv.cls) + (sv.act ? ' act" data-act="' + esc(sv.act) +
            '" data-pick="' + esc(p.id) + '"' + (sv.dl ? ' data-dl="' + esc(sv.dl) + '"' : '')
            : '"') + tipRef(sv) + '>' + esc(sv.chip) + '</span>' +
        '</div>';
      }).join('') +
      '<div class="srow wide" style="padding-top:4px">' +
        '<button class="ghost" data-act="sheet">Models ▸</button></div>' +
    '</div>';
  }

  /* QUEUE — only what the bridge actually reports */
  h += '<div class="sgroup"><span class="caps">' +
    '<i class="famdot" style="background:var(--h3)"></i>Queue</span>' +
    '<div class="kv"><span>State</span><b>' + esc(job ? job.state : 'idle') + '</b></div>' +
    (job && job.step && job.step_max
      ? '<div class="kv"><span>Step</span><b class="num">' + esc(job.step) + ' / ' +
        esc(job.step_max) + '</b></div>' : '') +
    '<div class="kv"><span>This session</span><b class="num">' + jobs.length +
      ' run' + (jobs.length === 1 ? '' : 's') + '</b></div>' +
  '</div>';

  paint('railbody', h);
  wireTips($('railbody'));
}

/* ── ③a THE MODEL / WORKFLOW PICKER ─────────────────────────────────────────────
   Debi's placement, verbatim: "in between the settings pane and Generate, where one can
   pick the different types and if it's present/installed, it'll work."

   Two selects and one verdict chip. The model list is the DISCOVERED catalogue, ordered
   installed-first; the workflow list is that model's own types, ordered ready-first.
   The chip is the whole answer to "will this work": ready, or exactly what is missing
   with its size and a Get that fetches only those files. It is advisory to the end —
   an incomplete workflow is selectable, readable and explains itself; nothing is
   greyed out of existence. */
function renderPicker() {
  const ms = catModels();
  if (!ms.length) { paint('picker', ''); return; }
  const m = curModel(), w = curWorkflow();
  const dl = w ? dlFor('wf:' + w.id) : null;
  const cur = wfCurated(w);
  const wv = workflowVerdict(w, dl || (cur ? dlFor(cur.id) : null));
  const hv = cur ? healthVerdict(cur, S.form.mode) : null;
  const need = needsSource();
  let h = '<span class="caps">Model</span>' +
    '<select id="p-model" aria-label="Model">' + ms.map(x =>
      '<option value="' + esc(x.id) + '"' + (m && x.id === m.id ? ' selected' : '') + '>' +
      esc(x.title) + ' · ' + (x.installed ? x.ready + ' of ' + x.workflow_count + ' ready'
                                          : 'not installed') +
      '</option>').join('') + '</select>' +
    '<span class="caps">Type</span>' +
    '<select id="p-wf" aria-label="Workflow">' + ((m && m.workflows) || []).map(x =>
      '<option value="' + esc(x.id) + '"' + (w && x.id === w.id ? ' selected' : '') + '>' +
      esc(x.title) + (x.complete ? '' : ' · ' + esc(x.missing_h || 'size unknown')) +
      '</option>').join('') + '</select>' +
    '<span class="chip ' + esc(wv.cls) + (wv.act ? ' act" data-act="' + esc(wv.act) +
      '" data-workflow="' + esc(w.id) + '"' + (wv.dl ? ' data-dl="' + esc(wv.dl) + '"' : '')
      : '"') + tipRef(wv) + '>' + esc(wv.chip) + '</span>' +
    (hv ? chipHtml(hv) : '') +
    (m && m.refused ? chipHtml({ chip:'refused here', cls:'c-bad', line:m.refused,
        hedge:'Standing verdict. It is listed rather than hidden, because a model that '
            + 'simply is not there reads as a bug in the scan.' }) : '');
  /* THE SOURCE. An image-to-video workflow with nothing to start from is a dead end
     dressed as a ready button, so the picture is chosen HERE, from what actually
     exists: this surface's own results and whatever is already in ComfyUI's input/. */
  if (need) {
    const list = (S.sources || []).filter(s => s.kind === need);
    h += '<span class="caps">Source</span>';
    if (!list.length) {
      h += chipHtml({ chip:'nothing to start from', cls:'c-warn',
        line:'This workflow starts from ' + (need === 'image' ? 'a picture' : 'a ' + need)
           + ' and there is none yet.',
        hedge:'Make one with an image model first, or drop a file into ComfyUI’s '
            + 'input folder — anything in the results rail can be used.' });
    } else {
      const held = (S.form.source || {}).filename;
      h += '<select id="p-src" aria-label="Source">' + list.map(s =>
        '<option value="' + esc(s.origin + '|' + s.subfolder + '|' + s.filename) + '"' +
        (held === s.filename ? ' selected' : '') + '>' + esc(s.label) + '</option>').join('') +
        '</select>';
      if (!S.form.source) {
        const s = list[0];
        S.form.source = { origin:s.origin, subfolder:s.subfolder, filename:s.filename };
      }
    }
  }
  h += '<span class="grow"></span>' +
    '<button class="ghost ovf" data-act="wf-menu"' +
      (w ? ' data-workflow="' + esc(w.id) + '"' : '') +
      ' aria-label="More actions">⋯</button>';
  paint('picker', h);
  wireTips($('picker'));
}

/* ── ③b the lower region: key options, the run control, the live status ─────── */
function renderComposer() {
  const c = currentPick();
  const ev = engineVerdict(S.state);
  const job = liveJob();
  const f = S.form;
  const d = (c && (c.defaults || {})[f.mode]) || {};

  const prompt = $('f-prompt');
  if (prompt && document.activeElement !== prompt && (f.prompt || '') !== prompt.value)
    prompt.value = f.prompt || '';
  if ($('pc')) $('pc').textContent = String((f.prompt || '').length);

  /* THE KEY OPTIONS. Deliberately NOT a second copy of the rail's width/height/steps
     fields: two inputs bound to one value is exactly the contradiction the one-verdict
     -object rule exists to prevent. What lives here is what you reach for between two
     runs of the same prompt — the mode, the model, and Generate — while the numbers
     stay in one place, the rail. */
  /* the numbers a run will really use, whichever path it takes — a discovered
     workflow's defaults come off its own converted graph, not off a curated table */
  const wf = curWorkflow(), dyn = wf && !wfCurated(wf);
  const dv = (k, alt) => {
    const typed = f[k];
    if (typed != null && typed !== '') return typed;
    return dyn ? wfDefault(wf, alt || k) : d[k];
  };
  const canRun = runMode() !== 'none';
  paint('keyrow',
    (dv('width') || dv('height')
      ? '<span class="chip c-dim num">' + esc(dv('width') || '?') + '×' +
        esc(dv('height') || '?') + '</span>' : '') +
    (dv('steps') != null ? '<span class="chip c-dim num">' + esc(dv('steps')) +
      ' steps</span>' : '') +
    (wfKind() === 'video' && dv('frames', 'length') != null
      ? '<span class="chip c-dim num">' + esc(dv('frames', 'length')) + 'f</span>' : '') +
    '<span class="grow"></span>' +
    '<button class="primary press" data-act="' + (job ? 'stop' : 'go') + '"' +
      ((S.busy || S.submitUnknown || !canRun || !ev.up) && !job ? ' disabled' : '') + '>' +
      (job ? 'Stop' : S.busy ? 'Submitting…'
        : S.submitUnknown ? 'Check queue…' : 'Generate') + '</button>');

  /* THE LIVE STATUS. Chips, and only the ones that are true right now. */
  let sl = '';
  if (job) {
    const el = Math.max(0, Math.round((Date.now() / 1000) - (job.submitted || 0)));
    sl += chipHtml({ chip:'step ' + (job.step || 0) + ' of ' + (job.step_max || '?'),
      cls:'c-gold', line:job.pick_title + ' · ' + job.mode + ' · ' + (job.shape || ''),
      math:'elapsed ' + secs(el),
      hedge:'One job at a time — ComfyUI runs them in order. You can leave this tab; '
          + 'the result is waiting when you come back.' });
    if (job.ws === false) sl += chipHtml({ chip:'(polling)', cls:'c-dim',
      line:'The live progress feed dropped.',
      hedge:'The result itself never depended on it — it is read from ComfyUI’s '
          + 'history, which is polled unconditionally.' });
    if (job.peak_bytes) sl += chipHtml({ chip:'peak ' + gb(job.peak_bytes), cls:'c-dim',
      line:'Peak phys_footprint of the ComfyUI process so far.',
      hedge:'Measured, not predicted.' });
  } else if (ev.up && lastJob() && lastJob().state === 'error') {
    /* ⚠️ A RUN THAT DIED MUST NOT DISAPPEAR (adversarial pass, 2026-08-29). The
       progress chips are drawn from the LIVE job, so a job that ended in error simply
       stopped being drawn: the bar emptied, the button said Generate again, and the
       page carried on showing the previous picture as if nothing had been asked. The
       failed run now states itself until the next one replaces it. */
    const j = lastJob();
    sl += chipHtml({ chip:'last run failed', cls:'c-bad',
      line:j.error || 'ComfyUI reported an error for that run.',
      math:(j.pick_title || '') + (j.shape ? ' · ' + j.shape : ''),
      hedge:'Nothing was written to the gallery for it. The settings are still here, '
          + 'so pressing Generate runs the same thing again.' });
  } else if (ev.up && lastJob() && lastJob().state === 'cancelled') {
    sl += chipHtml({ chip:'last run stopped', cls:'c-dim',
      line:'That run was stopped before it finished.',
      hedge:'Nothing was written to the gallery for it.' });
  } else if (!ev.up) {
    /* ENGINE DOWN: one short line WITH an action, not a warnbox essay. The old
       paragraph lives in the engine chip's hover and in Help. */
    sl += '<p class="say"><b>Engine is off.</b> Start it in MOT Deck → Components.</p>';
  }
  paint('statusline', sl);
  const pct = job && job.step && job.step_max
    ? Math.round(100 * job.step / job.step_max) : (job ? 4 : 0);
  const bar = $('prog') && $('prog').querySelector ? $('prog').querySelector('i') : null;
  if (bar && bar.style) bar.style.width = pct + '%';

  /* THE MISSING-MODEL REFUSAL (the 409): one line naming the file, and the Get chip
     that fixes it, right there. Never a generic "generation failed". */
  paint('refusal', refusalHtml());
  wireTips($('keyrow'));
  wireTips($('statusline'));
  wireTips($('refusal'));
}
function refusalHtml() {
  const v = S.validation;
  if (v && !v.ok && v.missing_models && v.missing_models.length) {
    const m = v.missing_models[0];
    /* the Get is aimed at whichever thing owns the file: a curated pick (sha-pinned) or
       the discovered workflow that named it (size-checked). Same button, same refusal
       grammar, and neither claims the other's guarantee. */
    const target = m.pick ? ' data-pick="' + esc(m.pick) + '"'
                          : ' data-workflow="' + esc(m.workflow || '') + '"';
    const dl = dlFor(m.pick || ('wf:' + (m.workflow || '')));
    /* ⚠️ "PRESS GET" WHILE IT IS DOWNLOADING IS A SMALL LIE, and this is the likeliest
       moment to hit the refusal — so the live download is shown instead of a button
       that would start nothing. The router says the same thing in `how`. */
    const live = dl && ['downloading', 'verifying'].includes(dl.state);
    return '<div class="row"><p class="say bad"><b>Missing:</b> ' + esc(m.name) +
      ' (' + esc(m.size_h) + ')</p>' +
      (live
        ? chipHtml({ chip:'Downloading ' + (dl.pct || 0) + '%', cls:'c-gold',
                     line:m.how, hedge:'It will run as soon as the file lands.' })
        : '<button class="primary" data-act="download"' + target + '>Get ' +
          esc(m.size_h) + '</button>') + '</div>';
  }
  if (v && !v.ok) return '<p class="say bad">' + esc(v.reason || 'cannot run') + '</p>';
  if (S.err) return '<p class="say bad">' + esc(S.err) + '</p>';
  return '';
}

/* ── the models sheet ───────────────────────────────────────────────────────── */
function renderSheet() {
  $('scrim').hidden = !S.sheet;
  if (!S.sheet) { $('sheet').innerHTML = ''; return; }
  const cu = (S.state && S.state.curation) || {};
  const cards = cu.picks || [];
  const dv = diskVerdict(S.state);
  const cap = cu.cap || {};
  const st = (S.state && S.state.comfy) || {};
  $('sheet').innerHTML =
    '<div class="row"><h2>Models</h2><span class="grow"></span>' +
      chipHtml(dv) +
      '<button class="ghost" data-act="refresh">Refresh</button>' +
      /* ⚠️ A BUTTON, NOT AN ANCHOR — see openComfyTab(): an <a target="_blank"> here
         opened Chrome instead of our own ComfyUI tab (Debi's bug). */
      '<button class="chip act" data-act="comfyui-tab">ComfyUI tab ↗</button>' +
      '<button class="ghost" data-act="close-sheet" aria-label="Close">✕</button></div>' +
    /* THE CAP-OVERSHOOT STATEMENT — Debi's ruling, kept verbatim, as ONE line and
       nowhere else on the page. ⚠️ IT SITS ABOVE THE ROWS, not in the footer the IA
       proposed: the sentence the bridge generates ends "…the smallest template-native
       pair is the one below", and printing it under the rows would have made a true
       sentence point at nothing. Placement follows the copy; the copy is generated
       from the same bytes the rows are. */
    (cap.text ? '<p class="say">' + esc(cap.text) + '</p>' : '') +
    (cards.length ? cards.map(c => modelRow(c)).join('')
      : '<p class="say">The curated list could not be built — the vendored ' +
        'workflow-template registry is not readable in this install. The ComfyUI tab ' +
        'still works.</p>');
  wireTips($('sheet'));
}
function modelRow(c) {
  const dl = dlFor(c.id);
  const sv = stateVerdict(c, dl);
  const lv = licenseVerdict(c);
  const hv = healthVerdict(c, null);
  /* the measurement for the mode this model is FOR — a video model's row quoting its
     (defective) still-image timing would be a true number answering the wrong question */
  const mv = measuredVerdict(c, c.role && c.modes.includes(c.role) ? c.role : c.modes[0]);
  const drift = c.registry_drift
    ? { chip:'registry drift', cls:'c-warn', line:c.registry_drift,
        hedge:'The pinned file list is what would be downloaded.' } : null;
  const open = S.manifest === c.id;
  return '<div class="mrow" data-pick="' + esc(c.id) + '">' +
    /* THE OVERRIDE. The rail picks the measured-good model for the chosen mode by
       itself; this is where a user who disagrees says so, without a second control on
       the resting page. The current one is marked by colour and aria-current, not by
       another word on screen. */
    (c.downloaded
      ? '<button class="mname" data-act="use" data-pick="' + esc(c.id) + '"' +
        (c.id === S.form.pick ? ' aria-current="true"' : '') + '>' + esc(c.title) + '</button>'
      : '<span class="mname">' + esc(c.title) + '</span>') +
    chipHtml({ chip:c.role || c.modes.join('+'), cls:'c-dim',
               line:c.vendor, math:'template ' + c.template, hedge:c.note }) +
    chipHtml({ chip:c.total_h, cls:'c-dim', line:'Total size of this model’s files.',
               math:c.files.map(f => f.name + ' · ' + gb(f.bytes)).join('\n'),
               hedge:'HEAD-verified against HuggingFace and sha256-pinned.' }) +
    '<span class="row">' + chipHtml(lv) + (hv ? chipHtml(hv) : '') +
      (drift ? chipHtml(drift) : '') + chipHtml(mv) + '</span>' +
    '<span class="chip act ' + esc(sv.cls) + '"' + (sv.act ? ' data-act="' + esc(sv.act) +
      '" data-pick="' + esc(c.id) + '"' + (sv.dl ? ' data-dl="' + esc(sv.dl) + '"' : '') : '') +
      tipRef(sv) + '>' + esc(sv.chip) + '</span>' +
    '<button class="ghost ovf" data-act="row-menu" data-pick="' + esc(c.id) +
      '" aria-label="More actions">⋯</button>' +
    (sv.pct != null ? '<i class="under" style="width:' + sv.pct + '%"></i>' : '') +
    (open ? '<div class="manifest">' + c.files.map(f =>
        '<div class="frow"><span class="fn">' + esc(f.directory) + '/' + esc(f.name) +
        '</span><span class="fs">' + gb(f.bytes) + '</span>' +
        chipHtml({ chip:f.state, cls:f.state === 'present' ? 'c-ok'
                     : f.state === 'corrupt' ? 'c-bad' : 'c-dim',
                   line:f.shared || (f.state === 'present' ? 'On disk at its pinned size.'
                        : f.state === 'corrupt' ? 'Wrong size on disk.'
                        : f.state === 'partial' ? 'Partly downloaded; the next attempt resumes.'
                        : 'Not downloaded yet.'),
                   math:f.on_disk_bytes != null ? gb(f.on_disk_bytes) + ' on disk' : '' }) +
        '</div>').join('') + '</div>' : '') +
  '</div>';
}

/* ⚠️ EACH SECTION RENDERS INSIDE ITS OWN try/catch, AND THAT IS NOT DEFENSIVE
   BOILERPLATE — IT IS A WALKED DEFECT. During the S1 adversarial pass ComfyUI was
   stopped under a live page and ONE typo threw inside a renderer; render() unwound and
   three sections painted EMPTY, which read as "there is nothing here" rather than
   "this half is broken" — a dead end dressed as an empty state.

   So a section that throws now says so, IN THAT SECTION, in one line; every other
   section still renders; and the poll keeps running so a transient fault self-heals. */
function section(name, el, fn) {
  try { return fn(); }
  catch (e) {
    try {
      const box = $(el);
      if (box) box.innerHTML = '<p class="say bad">' + esc(name) + ' failed to draw: ' +
        esc(String(e && e.message || e)) + ' — retrying on the next poll.</p>';
    } catch (e2) { /* the error path may never throw */ }
    return null;
  }
}

function render() {
  TIPS = {};                     /* the registry is per-render: no stale verdicts */
  /* A tooltip whose chip was just repainted away would hang over the page showing a
     verdict for an element that no longer exists — the stale-hover lie, cheaply. */
  if (_tipFor && document.body.contains && !document.body.contains(_tipFor)) tipHide();
  setVar($('centre'), '--stagef', String(S.stagef));
  if ($('centre')) $('centre').classList.toggle('sized', !!S.sized);
  /* both rails' widths are grid TRACKS, so the whole layout reflows off two numbers —
     the stage, the prompt, the thumbnails and the peek all follow with no second rule */
  setVar($('frame'), '--railw', S.railw + 'px');
  setVar($('frame'), '--resw', S.resw + 'px');
  section('header', 'pageerr', renderHeader);
  section('stage', 'stage-body', renderStage);
  section('caption', 'caps', renderCaps);
  section('results', 'thumbs', renderResults);
  section('settings', 'railbody', renderRail);
  section('picker', 'picker', renderPicker);
  section('composer', 'keyrow', renderComposer);
  /* the source list is fetched only when a workflow actually needs one — an
     image-to-video template is the only thing on this page that asks the question */
  if (needsSource() && S.sources === null) { S.sources = []; loadSources().then(render); }
  section('models', 'sheet', renderSheet);
  const live = liveJob();
  const dlLive = ((S.state && S.state.downloads) || [])
    .some(d => ['downloading', 'verifying'].includes(d.state));
  arm(live || dlLive ? 1000 : 15000);
  writeBack();
  /* the thumbnails were just repainted, so their measured height may have changed —
     re-resolve the peek after layout rather than on the next resize */
  queuePeek();
}

/* ══ WRITE-BACK (the Pixelmator mechanic) ══════════════════════════════════════
   When a run finishes, the values ACTUALLY used — the snapped frame count, the
   resolved size, the steps — land in the ordinary rail fields, so what the user
   sees is what they can edit and re-run. The seed deliberately does NOT: it resets to
   random after every run (the shipped behaviour, kept), and the drawn seed lives in
   the caption chip, which is click-to-reuse. */
function writeBack() {
  const j = lastJob();
  if (!j || j.state !== 'done' || S.wroteBack === j.id) return;
  S.wroteBack = j.id;
  /* ⚠️ ONLY ONTO THE WORKFLOW THAT RAN — walked live 2026-08-29, and it is the same
     lie as the mode-switch one door over. With the catalogue in charge the page can
     open on SDXL while the last finished run was a Wan clip, and the unguarded
     write-back then put 576×320 · 10 steps into SDXL's fields: numbers that describe a
     run this workflow never did, sitting under a Generate button that would use them.
     A finished run's values belong to the workflow that produced them. */
  const w = curWorkflow();
  if (w && j.workflow && j.workflow !== w.id) return;
  const m = /(\d+)\s*×\s*(\d+)(?:\s*·\s*(\d+)f)?/.exec(j.shape || '');
  if (m) {
    S.form.width = Number(m[1]);
    S.form.height = Number(m[2]);
    if (m[3]) S.form.frames = Number(m[3]);
  }
  if (j.steps) S.form.steps = Number(j.steps);
  S.form.seed = null;
  section('settings', 'railbody', renderRail);
}

/* ── the timer + the live stream ────────────────────────────────────────────── */
let timer = null, cadence = 0;
/* ⚠️ THE TIMER MUST BE NULLED WHEN IT FIRES, AND THIS IS A WALKED DEFECT, INHERITED
   FROM v1. The guard is "an already-armed timer at this cadence stands" — but a fired
   setTimeout leaves its id in `timer`, still truthy, so after the very first tick every
   later arm() took the early return and NOTHING WAS EVER SCHEDULED AGAIN. Measured
   here on 2026-08-29: ComfyUI was killed under a live page and the header went on
   saying "ComfyUI 0.34.1" and Generate stayed enabled for 36 s and counting, because
   the SSE stream only speaks when a download or job publishes and the engine dying
   publishes nothing. A surface whose whole value is a number that is true had quietly
   stopped asking. Nulling the id in the callback makes the guard mean what it says. */
function arm(ms) {
  if (timer && cadence === ms) return;
  cadence = ms;
  clearTimeout(timer);
  timer = setTimeout(() => { timer = null; load(); }, ms);
}
try {
  const sse = new EventSource('/api/events');
  sse.onmessage = (m) => {
    let j = null; try { j = JSON.parse(m.data); } catch (e) { return; }
    if (j.type === 'comfy') load();
  };
} catch (e) { /* no EventSource: the timer above is the whole mechanism */ }

/* ── input plumbing ─────────────────────────────────────────────────────────── */
function readForm() {
  const num = (id) => { const el = $(id); if (!el) return undefined;
                        const v = el.value.trim(); return v === '' ? undefined : Number(v); };
  const f = S.form;
  if ($('f-prompt')) f.prompt = $('f-prompt').value;
  if ($('f-neg')) f.negative = $('f-neg').value;
  if ($('f-seed')) { const v = $('f-seed').value.trim(); f.seed = v === '' ? null : Number(v); }
  ['width', 'height', 'steps', 'frames', 'fps', 'cfg'].forEach(k => {
    const v = num('f-' + k); if (v !== undefined) f[k] = v;
  });
}
/* ⚠️ THE PICKER'S SELECTS ARE `change`, NOT `click`, AND THE LIST MUST NOT REPAINT
   UNDER AN OPEN MENU. Choosing a model re-reads that model's own workflows and drops
   every number the PAGE wrote (the mode/model reset rule, one door over): a size that
   belonged to SDXL is not a size that belongs to a Wan template. A number the user
   TYPED is theirs and survives, exactly as it does across a mode switch. */
document.addEventListener('change', (e) => {
  const id = e.target && e.target.id;
  if (id === 'p-model') {
    readForm();
    S.form.model = e.target.value;
    S.form.workflow = null; S.form.source = null; S.sources = null;
    resetUntouched(); S.validation = null; saveView();
    /* `paint()` correctly protects a focused SELECT from being replaced beneath an
       open native menu. A `change` event means that menu has committed its choice,
       though, and keeping the model select focused would defer the Type repaint while
       the rest of the page already showed the new model. End that completed
       interaction before rendering so Model + Type remain one atomic visible choice. */
    if (e.target.blur) e.target.blur();
    render();
  } else if (id === 'p-wf') {
    readForm();
    S.form.workflow = e.target.value;
    S.form.source = null; S.sources = null;
    resetUntouched(); S.validation = null; saveView(); render();
  } else if (id === 'p-src') {
    const p = String(e.target.value || '').split('|');
    S.form.source = { origin:p[0], subfolder:p[1], filename:p.slice(2).join('|') };
  }
});
/* ⚠️ SWITCHING MODE OR MODEL RE-READS THAT TEMPLATE'S OWN DEFAULTS — unless you typed.
   Walked 2026-08-29: after an SDXL run wrote 1024×1024 back into the fields, switching
   to Clip kept 1024×1024 on a model whose stock video shape is 832×480, so the page
   was quietly offering to run a much heavier job than the template describes. A value
   the user TYPED is theirs and survives; a value the page wrote (a default, or a
   finished run's write-back) belongs to the model it came from and goes with it. */
function resetUntouched() {
  ['width', 'height', 'steps', 'frames', 'fps', 'cfg'].forEach(k => {
    if (!S.typed[k]) S.form[k] = null;
  });
  /* the negative prompt belongs to the template that shipped it — Wan's is a paragraph
     of Chinese, SDXL's is a list of English words, and carrying one into the other is
     the same defect as carrying 1024×1024 onto a 832×480 template. The id is `f-neg`,
     so the typed-flag is keyed `neg`. */
  if (!S.typed.neg) S.form.negative = null;
}
document.addEventListener('input', (e) => {
  if (e.target.id && e.target.id.startsWith('f-')) {
    S.typed[e.target.id.slice(2)] = true;
    readForm();
    if (e.target.id === 'f-prompt' && $('pc'))
      $('pc').textContent = String((S.form.prompt || '').length);
  }
});
/* a change that arrived while a field had focus is applied the moment it loses it */
document.addEventListener('focusout', () => setTimeout(flushPending, 0));

/* ══ THE SHELL BRIDGE — an IN-APP destination is a TAB SWITCH, never a URL ═══════
   ⚠️ DEBI'S BUG, VERBATIM: the ⋯ menu's "ComfyUI tab ↗" opened Google Chrome. It was an
   `<a target="_blank">` pointing at http://127.0.0.1:8188, and inside the app shell a
   target=_blank navigation is handed to the default browser — so the control named
   after one of our OWN tabs took the user out of the app entirely.

   The fix is the shipped handler pattern (v1.5.38 / v1.5.46, and office.html's goHome):
   post `{cmd:'switchTab', id, title}` to `window.webkit.messageHandlers.motdeck`, which
   app/main.swift resolves against its tab REGISTRY — id first, title second — and then
   takes the exact path a strip click takes. The Generate tab is one of the six webviews
   that gets the handler registered (main.swift's `t.id == "comfy"` branch), so this
   works from here.

   THE RULE THIS ENCODES, because the bug is a class and not an incident: a link to an
   IN-APP destination must switch tabs; a link to somebody else's website (a licence
   text on huggingface.co) is exactly what the browser is for and stays an anchor. The
   audit of this page found ONE offender — the two "ComfyUI tab ↗" items — and the two
   licence links, which are correct as they are. */
function shellHandler() {
  try {
    return (window.webkit && window.webkit.messageHandlers
            && window.webkit.messageHandlers.motdeck) || null;
  } catch (e) { return null; }
}
function switchTab(title, id) {
  const h = shellHandler();
  if (!h) return false;
  try { h.postMessage({ cmd:'switchTab', title:title, id:id }); return true; }
  catch (e) { return false; }
}
function openComfyTab() {
  /* id first, title second — the shell resolves the stable id against its registry and
     shows the tab even if the user had hidden it. */
  if (switchTab('ComfyUI', 'comfyui')) return true;
  const url = ((S.state && S.state.comfy && S.state.comfy.url) || '');
  if (!shellHandler() && url) { window.open(url, '_blank', 'noopener'); return true; }
  /* In the shell with no handler = a stale build. Say which control does the job rather
     than silently doing nothing, and never fall through to window.open, which is what
     would open Chrome again. */
  toast('This build cannot switch tabs from this page — pick ComfyUI on the tab strip '
      + 'above. (Run ./scripts/ship.sh if the shell is stale.)', true);
  return false;
}

/* Keep actionable status in this page-owned toast. Native JavaScript dialogs exist from
   S12 onward, but a blocking alert is still the wrong interaction for this path. */
let toastTimer = null;
function toast(msg, bad) {
  let t = $('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = bad ? 'bad' : '';
  t.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 9000);
}

/* ══ FULLSCREEN — a real FLIP, transform only, collapse 20% shorter ════════════
   Emil: 300ms in / 240ms out on --eo, transform and opacity ONLY (never width,
   height, top, left or a blur radius). The ground is on its own much slower token
   (IBM Carbon slow-02, 620ms) so it recedes rather than competing. WebKit names
   scaling animations a vestibular trigger, so under prefers-reduced-motion the zoom
   degrades to a crossfade — the feature stays, the travel goes. */
function aspectOf(it) {
  const m = it && /(\d+)\s*×\s*(\d+)/.exec(it.shape || '');
  if (m && Number(m[2])) return Number(m[1]) / Number(m[2]);
  return 3 / 2;                       /* only when the record does not say */
}
function fitFull(el, it) {
  if (!el || !el.style) return;
  if (!S.full) { el.style.left = el.style.top = el.style.width = el.style.height = ''; return; }
  const pad = 18, foot = 26, a = aspectOf(it);
  const w = window.innerWidth - pad * 2, h = window.innerHeight - pad * 2 - foot;
  const bw = Math.min(w, h * a), bh = bw / a;
  el.style.left = Math.round((window.innerWidth - bw) / 2) + 'px';
  el.style.top = Math.round((window.innerHeight - foot - bh) / 2) + 'px';
  el.style.width = Math.round(bw) + 'px';
  el.style.height = Math.round(bh) + 'px';
}
function paneEl(i) {
  if (!document.querySelector) return null;
  return document.querySelector('.pane[data-i="' + i + '"]');
}
function toggleFull(i) {
  const el = paneEl(i == null ? S.pane : i);
  if (!el) return;
  const it = paneItem(i == null ? S.pane : i);
  const reduce = typeof matchMedia === 'function'
    && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const a = el.getBoundingClientRect();
  S.full = !S.full;
  el.classList.toggle('full', S.full);
  document.body.classList.toggle('full', S.full);
  fitFull(el, it);
  if (reduce) return;
  const b = el.getBoundingClientRect();
  if (!b.width || !a.width) return;
  el.style.transformOrigin = 'top left';
  el.style.transition = 'none';
  el.style.transform = 'translate(' + (a.left - b.left) + 'px,' + (a.top - b.top) +
    'px) scale(' + (a.width / b.width) + ',' + (a.height / b.height) + ')';
  el.getBoundingClientRect();
  el.style.transition = 'transform ' + (S.full ? 300 : 240) + 'ms var(--eo)';
  el.style.transform = 'none';
  clearTimeout(window.__ft);
  window.__ft = setTimeout(() => {
    el.style.transition = '';
    if (!S.full) { el.style.transform = ''; render(); }
  }, S.full ? 320 : 260);
}

/* ══ RESIZE — direct manipulation, persisted ═══════════════════════════════════ */
function initGrip() {
  const g = $('grip'), c = $('centre');
  if (!g || !c || !g.addEventListener) return;
  let dragging = false;
  g.addEventListener('pointerdown', (e) => {
    dragging = true;
    if (g.setPointerCapture && e.pointerId != null) g.setPointerCapture(e.pointerId);
    document.body.classList.add('resizing');
    if (e.preventDefault) e.preventDefault();
  });
  g.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const r = c.getBoundingClientRect();
    if (!r || !r.height) return;
    S.stagef = clampFrac((e.clientY - r.top) / r.height);
    S.sized = true;
    c.classList.add('sized');
    setVar(c, '--stagef', String(S.stagef));
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('resizing');
    saveView();
  };
  g.addEventListener('pointerup', end);
  g.addEventListener('pointercancel', end);
  g.addEventListener('lostpointercapture', end);
  g.addEventListener('keydown', (e) => {
    const d = e.key === 'ArrowUp' ? -0.04 : e.key === 'ArrowDown' ? 0.04 : 0;
    if (!d) return;
    if (e.preventDefault) e.preventDefault();
    S.stagef = clampFrac(S.stagef + d);
    S.sized = true;
    c.classList.add('sized');
    setVar(c, '--stagef', String(S.stagef));
    saveView();
  });
}

/* ══ THE TWO SIDE RAILS — same grammar as the stage's grip ═════════════════════
   Debi's review: "both side panes resizable, with everything dynamic/auto-adjusting
   including the default stage view", and "when the user squeezes the stage toward the
   left, the right rail AUTO-GROWS in correlation (the thumbnails scale up)".

   Both are literally true here because the widths are GRID TRACKS: the centre column is
   `minmax(0,1fr)`, so every pixel taken from the stage is given to the rail being
   dragged, and the thumbnails — two `1fr` columns inside that rail — grow with it. The
   peek is re-measured off a real thumbnail afterwards, so "two rows plus a sliver"
   stays true at every width instead of only at the default one. */
function initVGrip(id, get, set, lo, hi) {
  const g = $(id), fr = $('frame');
  if (!g || !fr || !g.addEventListener) return;
  let dragging = false;
  const apply = (px) => {
    set(clampW(px, lo, hi, get()));
    setVar(fr, id === 'gripL' ? '--railw' : '--resw', get() + 'px');
    clearTimeout(window.__pk);
    window.__pk = setTimeout(syncPeek, 40);
  };
  g.addEventListener('pointerdown', (e) => {
    dragging = true;
    if (g.setPointerCapture && e.pointerId != null) g.setPointerCapture(e.pointerId);
    document.body.classList.add('resizing-x');
    if (e.preventDefault) e.preventDefault();
  });
  g.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const r = fr.getBoundingClientRect();
    if (!r || !r.width) return;
    apply(id === 'gripL' ? (e.clientX - r.left - 8) : (r.right - 8 - e.clientX));
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('resizing-x');
    saveView();
    syncPeek();
  };
  g.addEventListener('pointerup', end);
  g.addEventListener('pointercancel', end);
  g.addEventListener('lostpointercapture', end);
  g.addEventListener('keydown', (e) => {
    const d = e.key === 'ArrowLeft' ? -12 : e.key === 'ArrowRight' ? 12 : 0;
    if (!d) return;
    if (e.preventDefault) e.preventDefault();
    apply(get() + (id === 'gripL' ? d : -d));
    saveView();
  });
}
function initRails() {
  initVGrip('gripL', () => S.railw, (v) => { S.railw = v; }, RAIL_MIN, RAIL_MAX);
  initVGrip('gripR', () => S.resw, (v) => { S.resw = v; }, RES_MIN, RES_MAX);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    tipHide(); menuHide();
    if (S.full) { toggleFull(); return; }
    if (S.sheet) { S.sheet = false; render(); }
  }
}, true);
window.addEventListener('scroll', () => { tipHide(); menuHide(); }, true);
window.addEventListener('resize', () => {
  tipHide(); menuHide();
  if (S.full) fitFull(paneEl(S.pane), paneItem(S.pane));
}, true);

document.addEventListener('click', async (e) => {
  const inMenu = e.target.closest && e.target.closest('#menu');
  if (!inMenu && !(e.target.closest && e.target.closest('[data-act$="-menu"]'))) menuHide();
  if (e.target.closest && !e.target.closest('.tipped') && !e.target.closest('#tip')) tipHide();

  const modeBtn = e.target.closest && e.target.closest('#f-mode button');
  if (modeBtn) {
    readForm();
    S.form.mode = modeBtn.dataset.mode;
    const p = pickFor(S.form.mode);
    if (p) S.form.pick = p.id;
    resetUntouched();
    S.validation = null; render(); return;
  }
  if (e.target.id === 'scrim') { S.sheet = false; render(); return; }
  /* the fullscreen ground is a way out, like Esc and like clicking the picture again —
     a scrim you cannot dismiss is a trap (walked: it was one for exactly one revision) */
  if (e.target.id === 'fscrim') { if (S.full) toggleFull(); return; }

  const b = e.target.closest && e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;

  if (act === 'sheet')        { S.sheet = true; render(); }
  else if (act === 'close-sheet') { S.sheet = false; render(); }
  else if (act === 'verb')    { readForm(); S.adv = b.dataset.v === '1'; saveView(); render(); }
  else if (act === 'all')     { S.all = !S.all; $('results').classList.toggle('all', S.all);
                                b.innerHTML = S.all ? '&#9662;' : '&#9656;';
                                b.title = S.all ? 'Show two rows' : 'Show all results';
                                /* the peek is an inline length now, so the expand has
                                   to clear it — the CSS `max-height:none` cannot win
                                   against an inline rule */
                                syncPeek(); }
  else if (act === 'split')   { setSplit(Number(b.dataset.n)); }
  else if (act === 'refresh') { await load(); }
  else if (act === 'select')  { assign(b.dataset.fn); render(); }
  else if (act === 'pane') {
    const i = Number(b.dataset.i);
    if (S.full && i !== S.pane) toggleFull();   /* leave the screen before switching */
    if (i === S.pane) { toggleFull(i); }
    else {
      /* PROMOTE: the pane you clicked becomes the current one, and everything that
         describes "the result" — the caption chips, the rail's facts — follows it.
         The pane being left keeps whatever it was showing. */
      pinCurrent();
      S.pane = i;
      const it = paneItem(i);
      if (it) S.sel = it.filename;
      saveView(); render();
    }
  }
  else if (act === 'use') {
    const p = picks().find(x => x.id === b.dataset.pick);
    if (p) {
      const moved = S.form.pick !== p.id;
      S.form.pick = p.id;
      if (!p.modes.includes(S.form.mode)) S.form.mode = p.modes[0];
      if (moved) resetUntouched();
      S.sheet = false; S.validation = null; render();
    }
  }
  else if (act === 'reuse-seed') {
    S.form.seed = Number(b.dataset.seed); S.adv = true; saveView(); render();
    toast('Seed ' + b.dataset.seed + ' is in the seed field.');
  }
  else if (act === 'download') {
    b.disabled = true;
    const body = b.dataset.workflow ? { workflow: b.dataset.workflow }
                                    : { pick: b.dataset.pick };
    const r = await api('/api/comfy/download', { method:'POST', body: JSON.stringify(body) });
    if (!r.ok) { S.err = r.error; toast(r.error, true); }
    else if (r.no_url && r.no_url.length)
      toast('Fetching what upstream published; it has no link for ' +
            r.no_url.join(', ') + '.', true);
    await load();
  }
  else if (act === 'comfyui-tab') {
    menuHide();
    openComfyTab();
  }
  else if (act === 'wf-menu') {
    const w = curWorkflow();
    const its = [];
    if (w) its.push({ label:'Open template in ComfyUI', act:'template',
                      workflow:w.id });
    its.push({ label:'ComfyUI tab ↗', act:'comfyui-tab' });
    its.push({ label:'Models ▸', act:'sheet' });
    its.push({ label:'Reveal the models folder', act:'reveal-models' });
    menuShow(b, its);
  }
  else if (act === 'cancel') {
    await api('/api/comfy/download/' + b.dataset.dl + '/cancel', { method:'POST' });
    await load();
  }
  else if (act === 'stop') {
    const j = liveJob();
    if (j) await api('/api/comfy/jobs/' + j.id + '/cancel', { method:'POST' });
    await load();
  }
  else if (act === 'reveal') {
    const r = await api('/api/comfy/reveal', { method:'POST',
      body: JSON.stringify({ filename: b.dataset.fn, subfolder: b.dataset.sf }) });
    if (!r.ok) toast(r.error || 'could not reveal that file', true);
  }
  else if (act === 'row-menu') {
    const c = picks().find(x => x.id === b.dataset.pick);
    if (!c) return;
    menuShow(b, [
      { label:'Open template in ComfyUI', act:'template', pick:c.id },
      { label:(S.manifest === c.id ? 'Hide the file list' : 'Show the file list'),
        act:'manifest', pick:c.id },
      { label:'Reveal the models folder', act:'reveal-models' },
      { label:'Licence text ↗', href:c.license_url },
    ]);
  }
  else if (act === 'item-menu') {
    const its = [];
    if (b.dataset.job && b.dataset.graph === '1') {
      its.push({ label:'The exact graph that made this', act:'graph', job:b.dataset.job });
    }
    its.push({ label:'Reveal in Finder', act:'reveal', fn:b.dataset.fn, sf:b.dataset.sf });
    /* an act, not an href — the second half of Debi's Chrome bug lived here */
    its.push({ label:'ComfyUI tab ↗', act:'comfyui-tab' });
    menuShow(b, its);
  }
  else if (act === 'manifest') {
    S.manifest = (S.manifest === b.dataset.pick) ? null : b.dataset.pick;
    menuHide(); render();
  }
  else if (act === 'reveal-models') {
    menuHide();
    const r = await api('/api/comfy/reveal', { method:'POST',
      body: JSON.stringify({ what:'models' }) });
    if (!r.ok) toast(r.error || 'could not open that folder', true);
  }
  else if (act === 'template') {
    menuHide();
    const r = await api('/api/comfy/open-template', { method:'POST',
      body: JSON.stringify(b.dataset.workflow ? { workflow: b.dataset.workflow }
                                              : { pick: b.dataset.pick }) });
    toast(r.ok ? r.note : ('Could not write the template: ' + r.error), !r.ok);
  }
  else if (act === 'graph') {
    menuHide();
    const r = await api('/api/comfy/graph/' + b.dataset.job);
    if (r.ok) {
      const w = window.open('', '_blank');
      if (w) { w.document.title = 'graph'; const pre = w.document.createElement('pre');
               pre.textContent = JSON.stringify(r.graph, null, 2); w.document.body.appendChild(pre); }
      else toast('This window cannot open a viewer tab — open ' + location.origin +
                 '/comfy in a browser to read the graph.', true);
    } else if (/no such job/i.test(r.error || '')) {
      /* HONEST, NOT CRYPTIC. Job records live in the bridge's memory, so a result made
         before the last bridge restart no longer has one, and the raw "no such job"
         read as a bug in the button. Say what actually happened instead. (Ledger: the
         gallery registry could carry the graph; it is dropped from the list payload
         today, which is why this path exists at all.) */
      toast('The exact graph for this result is no longer on record — job records are '
          + 'kept until the bridge restarts. New results keep theirs.', true);
    } else toast(r.error, true);
  }
  else if (act === 'go') {
    readForm();
    if (S.submitUnknown) {
      toast('The last submission has an unknown outcome. Check Queue or refresh before retrying.', true);
      return;
    }
    if (!(S.form.prompt || '').trim()) { toast('Type a prompt first.', true); return; }
    const how = runMode();
    if (how === 'none') { toast('Pick a model whose files are here first.', true); return; }
    S.busy = true; S.err = null; S.validation = null; render();
    /* ONE BUTTON, TWO SUBMIT PATHS, AND THE PICKER DECIDES WHICH — a curated template
       runs through its sha-pinned, MEASURED builder (that is what the health verdict is
       about), everything else through the converter. */
    let body;
    if (how === 'workflow') {
      const w = curWorkflow();
      body = Object.assign({}, S.form, { workflow: w.id, mode: w.kind });
      delete body.pick;
    } else {
      const c = currentPick();
      body = Object.assign({}, S.form, { pick: c.id, mode: S.form.mode });
      delete body.workflow;
    }
    /* ⚠️ ECHO OF THE LOFFICE STUCK-LATCH BUG (2026-08-29, doctrine 6b). `api()` does NOT
       wrap its fetch, so a bridge that is down rejects — and this handler had no catch,
       so `S.busy` stayed true for the rest of the session. Nothing crashed visibly; the
       Generate button simply sat disabled reading "Submitting…" for ever, with the real
       reason only in a console nobody opens. A rejection is an ANSWER now. */
    const outcome = await MOTActionLifecycle.run((signal) => api('/api/comfy/generate', {
      method:'POST', body:JSON.stringify(body), signal
    // The bridge's longest supported submit path can spend 20s validating live node
    // metadata, up to 6s on each model listing, then 30s on ComfyUI's /prompt. Ninety
    // seconds clears that declared budget with room for local catalogue conversion;
    // this watchdog is for a request that never settles, not a slow healthy submit.
    }), 90000);
    S.busy = false;
    if (outcome.kind === 'unknown') {
      S.submitUnknown = true;
      S.err = 'MOT Deck stopped waiting after 90 seconds. The request may have reached '
        + 'ComfyUI; check Queue or refresh before trying again.';
      S.validation = null;
      render();
      return;
    }
    const r = outcome.kind === 'settled' ? outcome.value : {
      ok:false, error:'the bridge could not be reached: ' + outcome.error
    };
    if (!r.ok) { S.err = r.error; S.validation = r.validation || null;
                 if (!r.validation) toast(r.error, true); }
    else {
      /* a fresh random seed for the next one — AND the current pane is released, so the
         result of the run you just started lands where you are looking. ⚠️ WALKED
         DEFECT (2026-08-29): with the pane pinned to what was on it, a finished run
         grew the gallery, moved the counts and left the OLD picture on the stage with
         the OLD seed beside it. The other panes keep their pins: a comparison you set
         up is not disturbed by generating into the pane you selected. */
      S.form.seed = null; S.sel = null; S.panes[S.pane] = null; saveView();
    }
    await load();
  }
});
/* the panes are real buttons for the keyboard too */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const p = e.target && e.target.closest && e.target.closest('.pane');
  if (!p) return;
  e.preventDefault();
  const i = Number(p.dataset.i);
  if (i === S.pane) toggleFull(i);
  else { pinCurrent(); S.pane = i; const it = paneItem(i); if (it) S.sel = it.filename;
         saveView(); render(); }
});

/* ── the measured peek: exactly two rows plus a slice of the third ─────────────
   Jakub's rule wants a REAL peek, so the row height is measured off a real thumbnail
   rather than assumed from the aspect ratio and a guess at the rail's width. */
function syncPeek() {
  const t = $('thumbs');
  const one = t && t.querySelector ? t.querySelector('.thumb') : null;
  if (one && one.offsetHeight)
    setVar(document.documentElement, '--thumb', one.offsetHeight + 'px');
  /* ⚠️ THE RESOLVED HEIGHT IS WRITTEN AS A PLAIN LENGTH, AND THAT IS THE FIX FOR THE
     DEFECT DEBI ACTUALLY SAW. The CSS says `max-height: calc(2 * var(--thumb, 72px) …)`
     with `transition: max-height 300ms`. Measured live in this engine on 2026-08-29:
     WebKit NEVER ADVANCES that transition — a calc() carrying an unregistered custom
     property is not interpolable against the previous length, so the element sits on
     the FROM value forever and the rail keeps rendering at the fallback. Setting
     `transition:none` on the node made the same declaration resolve to 230px instantly,
     which is how the cause was established rather than guessed.

     That is why the shipped rail drew SIX SMALL pictures instead of four: --thumb was
     being measured correctly every time and the CSS was ignoring it, so the peek was
     frozen at whatever the fallback happened to be. Writing the number here transitions
     between two plain lengths, which WebKit does animate, and makes the measured peek
     true at every rail width — which is the whole point of a rail you can drag. */
  if (t && t.style) {
    t.style.maxHeight = S.all ? 'none'
      : (one && one.offsetHeight ? (2 * one.offsetHeight + 6 + 10) + 'px' : '');
  }
}
/* ⚠️ A TIMER AS WELL AS A FRAME, AND THE TIMER IS THE ONE THAT ACTUALLY FIRES. Walked
   2026-08-29: with the tab in the background requestAnimationFrame does not run at all,
   so the peek was never resolved on a load that happened while the Generate tab was not
   the front one — the rail then stood at the CSS fallback and drew six small pictures
   again, which is the very defect this is here to fix, restored by an invisible
   scheduling assumption. rAF still runs first when it can (it measures after layout);
   the timer is what guarantees it runs at all. */
function queuePeek() {
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(syncPeek);
  clearTimeout(window.__peekT);
  window.__peekT = setTimeout(syncPeek, 60);
}
window.addEventListener('resize', queuePeek);

loadView();
initGrip();
initRails();
load();
queuePeek();
setTimeout(syncPeek, 300);
</script>
</body>
</html>
