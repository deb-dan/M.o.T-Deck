// its own storage key, in an iframe that is same-origin with us — the identical
// mechanism, and the identical justification, as the provider seed above.
//
// ⚠️ VERSION FENCE. Both the key name and the {messages,inputValue,attachedText} shape
// are read out of plugin 3.2.2. A bump can rename either silently, and a silently
// renamed key degrades to exactly today's behaviour (a chat that does not survive) —
// never to a WRONG chat on the wrong file, because we only ever move a blob we found
// under the name we know. test_oo_ai_lane.py asserts these constants against the
// vendored file whenever the plugin is installed.
const AI_CHAT_KEY = 'onlyoffice_ai_chat_state';       // ai/scripts/chat.js
const AI_CHAT_PLUGIN_VER = '3.2.2';                   // the pin this was read from
const AI_CHAT_MINE = 'mot.ooai.chat.';                // + file name → our per-file blob
const AI_CHAT_INDEX = 'mot.ooai.chat.index';          // LRU list of file names
const AI_CHAT_MAX_FILES = 12;                         // keep the last dozen documents
const AI_CHAT_MAX_BYTES = 512 * 1024;                 // one conversation's ceiling
let aiChatSaves = 0, aiChatRestores = 0, aiChatDrops = 0;   // reported by probe()
let aiChatLast = '';        // what the last handover actually did, for a probe to read

// Every same-origin frame under this page, the editor iframe and the plugin iframes
// inside it included. A cross-origin frame throws on property access — skipped, never
// fatal: this whole feature is a convenience and must never cost anyone an editor.
function aiFrames(win, out, depth) {
  out = out || []; depth = depth || 0;
  if (depth > 6) return out;
  try {
    out.push(win);
    for (let i = 0; i < win.frames.length; i++) {
      try { aiFrames(win.frames[i], out, depth + 1); } catch (e) { /* cross-origin */ }
    }
  } catch (e) { /* cross-origin */ }
  return out;
}

// The plugin's background frame publishes `window.chatWindow` (register.js's last line
// of chatWindowShow). Absent until the user has opened the Chatbot at least once —
// which is exactly the case where there is nothing to save.
function aiChatWindow() {
  const fr = aiFrames(window);
  for (let i = 0; i < fr.length; i++) {
    try {
      const cw = fr[i].chatWindow;
      if (cw && typeof cw.command === 'function') return cw;
    } catch (e) { /* cross-origin */ }
  }
  return null;
}

function aiChatRead() {
  try { return window.localStorage.getItem(AI_CHAT_KEY); } catch (e) { return null; }
}

// FLUSH. Command the plugin's own save and wait for the value to actually change —
// polling rather than attachEvent because attachEvent("onUpdateState") would REPLACE
// the plugin's own dock-change handler and break a feature to fix a feature.
//
// ⚠️ BOUNDED BY WALL TIME, NOT BY TICK COUNT, AND THAT DISTINCTION IS A MEASURED BUG
// (live WKWebView, 2026-08-28). The first draft polled "14 times, 50ms apart" and
// called that 700ms. It is not 700ms: WebKit CLAMPS timers hard in a window that is
// not on screen, so those fourteen ticks took over THIRTY SECONDS — and because the
// swap awaits the flush, the whole document switch sat at "converted to the editor
// format" and never started the new editor. A background tab, an occluded window and
// a Mac on battery all reach that state, so this was a real hang and not a probe
// artefact. Timers are a HINT about delay and a PROMISE about order; only the clock
// says how long anything took.
const AI_CHAT_FLUSH_MS = 800;
async function aiChatFlush() {
  const cw = aiChatWindow();
  if (!cw) return aiChatRead();          // never opened, or already torn down
  const before = aiChatRead();
  try { cw.command('onUpdateState'); } catch (e) { return before; }
  const t0 = Date.now();
  while (Date.now() - t0 < AI_CHAT_FLUSH_MS) {
    await new Promise((r) => setTimeout(r, 30));
    const now = aiChatRead();
    if (now !== null && now !== before) return now;
  }
  return aiChatRead();
}

function aiChatIndex() {
  try {
    const v = JSON.parse(window.localStorage.getItem(AI_CHAT_INDEX) || '[]');
    return Array.isArray(v) ? v.filter((x) => typeof x === 'string') : [];
  } catch (e) { return []; }
}

// STORE the outgoing document's conversation under its own name. Bounded three ways —
// a per-conversation ceiling, an LRU over documents, and a quota retry — because a
// localStorage that fills up would break the PROVIDER SEED that shares it, i.e. it
// would cost the AI tab itself. Losing an old chat is the right thing to lose.
function aiChatStore(name, blob) {
  if (!name) return;
  // ⚠️ NOTHING IS EVER DELETED BECAUSE THE FLUSH CAME BACK EMPTY, and this cost a
  // whole live run to find (2026-08-28, walking the swap in a real WKWebView). The
  // first draft treated a null flush as "this file has no conversation" and removed
  // the stored one — so a swap through a document whose plugin frame had not finished
  // waking up SILENTLY ATE the previous file's chat. That is a LIE-TO-USER (typed
  // work vanishing with no message), and it is exactly the shape the doctrine ranks
  // above a crash. "I could not read the chat" and "there is no chat" are different
  // facts, and only the second one may delete anything.
  if (blob === null || blob === undefined || blob === 'null') { aiChatDrops++; return; }
  let idx = aiChatIndex().filter((n) => n !== name);
  if (blob.length > AI_CHAT_MAX_BYTES) { aiChatDrops++; return; }
  const wrapped = JSON.stringify({v: AI_CHAT_PLUGIN_VER, blob: blob});
  idx.unshift(name);
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      while (idx.length > AI_CHAT_MAX_FILES) {
        const gone = idx.pop();
        try { window.localStorage.removeItem(AI_CHAT_MINE + gone); } catch (e) { }
      }
      window.localStorage.setItem(AI_CHAT_MINE + name, wrapped);
      window.localStorage.setItem(AI_CHAT_INDEX, JSON.stringify(idx));
      aiChatSaves++;
      return;
    } catch (e) {
      // Quota. Drop the oldest and try again; give up quietly on the third failure —
      // an unsaved chat is a disappointment, a broken editor is a defect.
      if (idx.length > 1) { const gone = idx.pop();
        try { window.localStorage.removeItem(AI_CHAT_MINE + gone); } catch (e2) { } }
      else { aiChatDrops++; return; }
    }
  }
  aiChatDrops++;
}

// RESTORE the incoming document's conversation into the plugin's own key — or CLEAR
// it. The clear is the load-bearing half: without it the plugin would open B showing
// A's conversation, which is a LIE-TO-USER (a chat about the wrong sheet) and strictly
// worse than the empty chat we started from.
function aiChatRestore(name) {
  let blob = null;
  try {
    const raw = window.localStorage.getItem(AI_CHAT_MINE + name);
    if (raw) {
      const o = JSON.parse(raw);
      // A blob written by a DIFFERENT plugin version is not replayed into it. The
      // shape is that version's, not this one's, and a half-understood chat state is
      // the kind of thing that renders as an empty panel with no explanation.
      if (o && o.v === AI_CHAT_PLUGIN_VER && typeof o.blob === 'string') blob = o.blob;
    }
  } catch (e) { blob = null; }
  try {
    if (blob) { window.localStorage.setItem(AI_CHAT_KEY, blob); aiChatRestores++; }
    else { window.localStorage.removeItem(AI_CHAT_KEY); }
  } catch (e) { /* storage refused — the plugin simply opens with an empty chat */ }
  return !!blob;
}

// The whole handover, in the order that makes it safe: save what the OLD document had
// (which requires the old editor to still be alive), then plant what the NEW one had.
// ⚠️ SERIALISED, NOT GUARDED, AND THE DIFFERENCE IS THE WHOLE FEATURE. The first draft
// used a boolean "busy" flag and DROPPED any handover that arrived while another was
// running — measured live: the 20s autosave holds the flag for its 700ms poll, a swap
// landing inside that window skipped BOTH halves, and the incoming file's conversation
// was therefore never planted. A dropped save is a lost chat; a dropped restore is an
// empty panel. So every handover queues behind the one before it instead.
let aiChatQueue = Promise.resolve();
function aiChatHandover(fromName, toName) {
  if (!aiSeeded) return Promise.resolve();   // no AI tab this session — nothing to move
  aiChatQueue = aiChatQueue.then(async function () {
    try {
      if (fromName) {
        const t0 = Date.now();
        aiChatStore(fromName, await aiChatFlush());
        aiChatLast = 'saved ' + fromName + ' in ' + (Date.now() - t0) + 'ms';
      }
      if (toName) aiChatLast = 'restore ' + toName + ': ' + aiChatRestore(toName);
    } catch (e) {
      aiChatLast = 'error ' + e;
      console.log('[oo ai-chat] ' + e);
    }
  });
  return aiChatQueue;
}

// ⚠️ TRAP FIVE, AND IT IS THE ONE THAT ACTUALLY DESTROYS THE CHAT (measured live,
// 2026-08-28, after the save/restore pair above was already working):
//
//     ai/scripts/code.js
//         function clearChatState() {
//             let key = 'onlyoffice_ai_chat_state';
//             if (window.localStorage.getItem(key)) window.localStorage.removeItem(key);
//         }
//         window.Asc.plugin.init = async function() { … clearChatState(); … }
//
// The plugin DELETES its own conversation on every start — deliberately, because
// upstream's plugin lives in one long-running editor session and treats a reload as a
// new conversation. In OUR one-editor world every document swap re-inits the plugin,
// so that line is the disappearance Debi reported. It also lands AFTER the seed the
// glue page plants before construction, which is why planting once is not enough: we
// plant, the editor comes up, the plugin's init wipes it, and the Chatbot then opens
// on nothing. MEASURED exactly that: `restore MOTA-A.xlsx: true` in the probe, and the
// key gone from localStorage 30 seconds later with no other writer in the frame.
//
// So the plant is HELD rather than done once. Until the user actually opens the
// Chatbot (at which point chat.js's restoreState has read the key and the plugin owns
// it again), a cheap watcher re-plants the document's conversation whenever the key
// goes missing. It only ever WRITES when the key is absent, so it is one write per
// wipe and a single localStorage read per second otherwise; it stops the moment a chat
// window exists or the document changes under it.
// Carry a stored conversation across a RENAME. Pure key move — the blob is already in
// this plugin version's shape, so re-wrapping it would only invent a chance to differ.
function aiChatRename(from, to) {
  if (!aiSeeded || !from || !to || from === to) return;
  try {
    const raw = window.localStorage.getItem(AI_CHAT_MINE + from);
    if (raw === null) return;
    window.localStorage.setItem(AI_CHAT_MINE + to, raw);
    window.localStorage.removeItem(AI_CHAT_MINE + from);
    const idx = aiChatIndex().map((n) => (n === from ? to : n));
    window.localStorage.setItem(AI_CHAT_INDEX, JSON.stringify(idx));
  } catch (e) { /* the chat simply stays under the old name; nothing else breaks */ }
}

// ⚠️ MEASURED: the wipe is not a one-off. Walking a real swap, the key was cleared
// roughly every two seconds for as long as the Chatbot stayed shut (54 re-plants in
// 100s) — the plugin re-runs clearChatState from more than one lifecycle hook. So the
// hold is a standing one, it is CAPPED so a pathological loop cannot run for ever, and
// its re-plants are counted separately from real restores: a metric that silently
// counts housekeeping as work is a metric that cannot answer "did the swap restore it".
const AI_CHAT_HOLD_MAX = 600;
let aiChatHold = null, aiChatHolds = 0;
function aiChatArm(name) {
  if (aiChatHold) { clearInterval(aiChatHold); aiChatHold = null; }
  if (!aiSeeded || !name) return;
  let planted = 0;
  aiChatHold = setInterval(function () {
    if (DOC !== name || aiChatWindow() || planted >= AI_CHAT_HOLD_MAX) {
      clearInterval(aiChatHold); aiChatHold = null; return;   // the plugin has it now
    }
    if (aiChatRead() !== null) return;
    const was = aiChatRestores;
    if (aiChatRestore(name)) { planted++; aiChatHolds++; aiChatRestores = was; }
  }, 1000);
}

// ⚠️ AND THE SWAP IS NOT THE ONLY WAY THE FRAME DIES. Quitting the app, ⌘R, or the
// host replacing the embed all destroy the plugin without any swap — and the flush
// above is ASYNC (it waits on a postMessage round trip), so it cannot be completed
// from `pagehide`. So the conversation is also checkpointed on a slow timer whenever a
// chat window is actually open. The cost is one postMessage and one small
// localStorage write every 5s, and ONLY while the user has the Chatbot open; the
// benefit is that "I typed a question, then quit" is no longer a silent loss.
// The residual limit — up to 5s of chat can still be lost to a hard quit — is stated
// in LOffice's Help → About rather than hidden.
// aiChatHandover serialises every flush in aiChatQueue, so a slow postMessage reply
// cannot overlap or reorder checkpoints. A tick that arrives while one is pending is
// queued, not dropped; document swaps use the same queue.
const AI_CHAT_AUTOSAVE_MS = 5000;
setInterval(function () {
  if (!aiSeeded || !DOC || !aiChatWindow()) return;
  aiChatHandover(DOC, '').catch(() => { /* never fatal */ });
}, AI_CHAT_AUTOSAVE_MS);

// ══ TRAP SIX: THE RIBBON'S BLOCKING MODAL, AND THE PLUGIN'S OWN CURE FOR IT ══
//
// ⚠️ THE OBSERVED DEFECT (Debi, 2026-08-28): press AI → Summarization or AI →
// Translation and the whole editor goes behind a centred "AI (model)" spinner for the
// ENTIRE generation — a minute and more on a 27B — with no sign of life and no way
// out. MEASURED live (WKWebView, real sheet, real runner): the `asc-loadmask` appears
// 1.5s after the click and is still up 120s later, unchanged.
//
// It is NOT a plugin loader and there is no setting. It is the EDITOR's own
// BlockInteraction long action, which the plugin asks for itself, and the plugin
// already contains the cure — it just does not use it from the ribbon:
//
//   ai/scripts/engine/engine.js:512   chatRequest(content, block, streamFunc)
//                                     → _wrapRequest(..., block !== false, streamFunc)
//                             :577    let isStreaming = (undefined !== streamFunc)
//                             :718    return allChunks   ← the WHOLE answer, streamed
//   ai/scripts/engine/register.js:186-212   the CHATBOT's pattern: own StartAction,
//                                     chatRequestAgent(data, /*block*/ false, chunk =>
//                                     { first chunk → EndAction }) — the modal lasts
//                                     TTFT and the answer then streams into the panel.
//   register.js 455/483/501/519/544/563/583/603/635/901 and code.js:1448 — the ribbon
//                                     and context-menu actions: `chatRequest(prompt)`.
//                                     No block flag, no streamFunc ⇒ block defaults
//                                     TRUE and NOTHING releases it until the last token.
//
// So this shim gives those call sites the Chatbot's pattern from OUTSIDE the plugin:
// wrap `AI.Request.prototype.chatRequest` in the plugin's own (same-origin) frame,
// and for a call that is BLOCKING AND NON-STREAMING — i.e. exactly a ribbon/context
// action — call through with `block=false` plus a streamFunc of ours, bracketed by
// our own StartAction/EndAction.
//
// ⚠️ NOT ONE VENDORED BYTE IS TOUCHED, and the plugin is pinned at 3.2.2 / commit
// 799b287, which is upstream master HEAD (docs/research/2026-08-28-onlyoffice-forks-
// loader.md: no fork and no upstream commit fixes this; we are the only ones who can).
// This is the same mechanism and the same justification as the chat-state fix above:
// their runtime, our origin, their published request path.
//
// ── AND THE HALF THAT IS NOT IN THE RECON, BECAUSE IT ONLY SHOWS UP IF YOU LOOK AT
//    WHERE THE ANSWER LANDS ────────────────────────────────────────────────────────
// "Release the editor at the first token" is the right fix for the CHATBOT because
// the answer lands in a PANEL. Most ribbon actions do not do that: they write the
// result into the LIVE DOCUMENT AT THE CURRENT SELECTION the instant it arrives —
//     register.js:901  result = await requestEngine.chatRequest(prompt);
//                      result = Asc.Library.getTranslateResult(result, content);
//                      await Asc.Library.PasteText(result);
// The Block is what stops the user moving that selection while the model thinks. Take
// it away for 70 seconds and the user does the obvious thing — clicks another cell —
// and the translation of the FIRST selection is pasted over the SECOND one, silently
// destroying it. That is the LIES-TO-USER class the doctrine ranks above a crash, and
// it would be caused BY the fix. So the release is conditional, and the condition is
// a fact about the UI rather than a hard-coded list of action names:
//
//   RELEASE EARLY only while the editor is showing a PLUGIN MODAL (`.asc-window.modal`
//   in the editor document AND a plugin window frame with a `windowID`). Then the
//   document is already unreachable behind the plugin's own dialog, the editor's Block
//   is pure redundancy, and the result cannot land anywhere the user has moved —
//   Summarization's result goes into the dialog and is inserted later, by an explicit
//   click. That is the ribbon's long action, and it is now released at the first chunk.
//
//   OTHERWISE the Block is KEPT — but the wait stops being a lie by omission. We are
//   streaming now, so we know the difference between "nothing has come back" and "the
//   model is thinking" and "the model is writing, 312 characters so far", and we say
//   so in a chip of our own over the editor, with a Stop.
//
// ⚠️ THE VERSION FENCE, TWICE. Every constant here was read out of plugin 3.2.2 and
// editor v9.2.0.119+5. If either is not what is installed, this shim does NOTHING and
// the ribbon behaves exactly as it does today (blocking) — never a half-wrapped
// request, never a released Block on an editor whose modal we cannot recognise.
const AI_STREAM_PLUGIN_VER = '3.2.2';                 // the pin the seam was read from
const AI_STREAM_EDITOR_TAG = 'v9.2.0.119+5';          // …and the pin `.asc-window.modal`
const AI_STREAM_MODAL_SEL = '.asc-window.modal';      // editor's own modal dialog
let aiStreamWrapped = false;      // the prototype in the live plugin frame is wrapped
let aiStreamCalls = 0;            // blocking, non-streaming requests we took over
let aiStreamReleases = 0;         // …of which released the Block at the first chunk
let aiStreamStops = 0;            // …of which the user stopped (nothing was written)
let aiStreamTTFT = 0;             // ms to the first chunk of the last one
let aiStreamLast = '';            // what the last one did, for a probe to read

// ⚠️ THE TRIM IS NOT COSMETIC — IT IS THE TAIL-INTEGRITY GUARANTEE. Upstream's
// `processResult` (engine.js:617) passes `isTrim = isStreaming ? false : true`, so the
// blocking path strips a leading `<think>…</think>` and leading/trailing newlines and
// the STREAMING path does neither. Left alone, "the same action, streamed" would put a
// different string into the document than "the same action, blocked" — a silent
// content difference caused by our own change, which is the worst thing this slice
// could ship. This reproduces upstream's own two steps (provider.js:263-274,
// engine.js:617-624) over the accumulated answer, so streamed output === blocked
// output. Pinned against the vendored bytes in test_oo_ai_lane.py.
function aiStreamNormalize(text) {
  if (typeof text !== 'string' || text === '') return text;
  let s = text;
  if (0 === s.indexOf('<think>')) {
    const end = s.indexOf('</think>');
    if (end !== -1) s = s.substring(end + 8);
  }
  let iStart = 0, iEnd = s.length - 1;
  while (iStart < iEnd && s.charCodeAt(iStart) === 10) iStart++;
  while (iEnd > iStart && s.charCodeAt(iEnd) === 10) iEnd--;
  if (iEnd > iStart && (iStart !== 0 || iEnd !== (s.length - 1))) s = s.substring(iStart, iEnd + 1);
  return s;
}

// Is the editor showing a plugin MODAL right now? Two independent signals, both
// same-origin DOM/location reads, because releasing the Block on a wrong answer here
// is the one way this shim could cost a user their data:
//   1. the EDITOR's own modal dialog element (this is what makes the document
//      unreachable — the class pair is read out of the pinned editor build), and
//   2. a plugin window FRAME, which is what a `PluginWindow` opens (`windowID=` in its
//      URL; the plugin's background frame and the DOCKED Chatbot are not that).
// A docked Chatbot alone must NOT count: it leaves the ribbon usable, so a Translation
// started with the chat open would otherwise look "safe" and would not be.
function aiStreamModal() {
  if (editorTag !== AI_STREAM_EDITOR_TAG) return false;   // unknown build ⇒ never release
  let modal = false;
  try {
    const d = window.frames[0] && window.frames[0].document;
    const n = d && d.querySelectorAll(AI_STREAM_MODAL_SEL);
    for (let i = 0; n && i < n.length; i++) {
      const r = n[i].getBoundingClientRect();
      if (r.width > 2 && r.height > 2) { modal = true; break; }
    }
  } catch (e) { return false; }
  if (!modal) return false;
  const fr = aiFrames(window);
  for (let i = 0; i < fr.length; i++) {
    try {
      const h = String(fr[i].location.href);
      if (h.indexOf('/ooplug/') !== -1 && h.indexOf('windowID=') !== -1) return true;
    } catch (e) { /* cross-origin */ }
  }
  return false;
}

// ── THE CHIP: the only new pixels in this slice ──────────────────────────────
// It lives in OUR page, over the editor iframe, because the thing it has to be
// visible ON TOP OF is the editor's own full-frame block overlay. It is styled for a
// LIGHT surface with explicit colours for the same reason `body.embed` is: the editor
// is pinned to `default-light` and the sheet is a white page under every motdeck
// design, so a chip that followed the panel's dark tokens would be the one dark object
// on a white sheet. Verified under Editorial and Studio, light and dark.
let aiStreamTick = null;
function aiStreamChipHide() {
  if (aiStreamTick) { clearInterval(aiStreamTick); aiStreamTick = null; }
  const c = el('aichip');
  if (c) c.classList.remove('on');
}
function aiStreamChipShow(job) {
  const c = el('aichip');
  if (!c) return;
  c.classList.add('on');
  const paint = function () {
    const secs = Math.round((Date.now() - job.t0) / 1000);
    let what;
    if (job.stopped) what = 'stopping…';
    else if (!job.chunks) what = 'AI is working — nothing has come back yet';
    else if (!job.chars) what = 'AI is thinking';
    else what = 'AI is writing — ' + job.chars + ' characters so far';
    el('aichip-t').textContent = what + ' · ' + secs + 's';
    // Honest about the editor, because the two cases look different on screen and a
    // user who is told "you can keep working" while the editor is blocked is lied to.
    el('aichip-n').textContent = job.released
      ? 'the editor is free again'
      : 'the editor is held until this lands in the document';
  };
  paint();
  if (aiStreamTick) clearInterval(aiStreamTick);
  aiStreamTick = setInterval(paint, 1000);
  el('aichip-stop').onclick = function () {
    job.stopped = true;                     // read by the streamFunc on the next chunk
    paint();
  };
}

// THE WRAP ITSELF. Assigned onto the prototype INSIDE the plugin's frame; `this` is
// the plugin's own AI.Request, `orig` its own method, and every argument is passed
// through untouched on every path we do not own.
function aiStreamWrap(win) {
  if (aiStreamWrapped) return true;
  if (!aiStatus || aiStatus.version !== AI_STREAM_PLUGIN_VER) return false;
  let AIns, proto, Asc;
  try {
    AIns = win.AI; Asc = win.Asc;
    proto = AIns && AIns.Request && AIns.Request.prototype;
  } catch (e) { return false; }
  // The structural fence: the exact seam this was written against, or nothing.
  if (!proto || typeof proto.chatRequest !== 'function'
      || proto.chatRequest.length !== 3               // (content, block, streamFunc)
      || typeof proto._wrapRequest !== 'function'
      || !Asc || !Asc.Editor || typeof Asc.Editor.callMethod !== 'function') return false;
  const orig = proto.chatRequest;
  proto.chatRequest = async function (content, block, streamFunc) {
    // EVERY call that is already streaming, or already non-blocking, is somebody
    // else's design (the agent loop, the helpers, the annotators) and is passed
    // through byte for byte. We only take over the shape nothing releases: blocking,
    // no streamFunc — which is exactly the ribbon and context-menu call sites.
    if (block === false || streamFunc !== undefined) {
      return await orig.call(this, content, block, streamFunc);
    }
    const label = 'AI (' + ((this.modelUI && this.modelUI.name) || '') + ')';
    const job = {t0: Date.now(), chunks: 0, chars: 0, released: false, stopped: false};
    let started = false, ended = false;
    const end = async function () {
      if (!started || ended) return;
      ended = true;
      try { await Asc.Editor.callMethod('EndAction', ['Block', label]); } catch (e) { }
    };
    try { await Asc.Editor.callMethod('StartAction', ['Block', label]); started = true; }
    catch (e) { /* no block went up; we simply never take one down */ }
    aiStreamCalls++;
    aiStreamTTFT = 0;
    aiStreamLast = 'running';
    // The release decision is taken ONCE, at the start, from the UI as it is when the
    // user pressed the button — not re-read later, when a dialog may have closed.
    const mayRelease = aiStreamModal();
    aiStreamChipShow(job);
    try {
      const out = await orig.call(this, content, false, async function (chunk) {
        job.chunks++;
        if (typeof chunk === 'string') job.chars += chunk.length;
        if (!aiStreamTTFT) {
          aiStreamTTFT = Date.now() - job.t0;
          if (mayRelease) { job.released = true; aiStreamReleases++; await end(); }
        }
        // The user pressed Stop. Returning true is the plugin's OWN documented way to
        // abort the read (engine.js:718: `if (isBreak === true) await
        // readerAsync.abort()`), and we then return '' rather than the partial text —
        // every ribbon call site does `if (!result) return;`, so nothing is written.
        // A HALF-TRANSLATION PASTED INTO THE SHEET WOULD BE THE LIE THIS WHOLE SLICE
        // EXISTS TO AVOID.
        return job.stopped === true;
      });
      if (job.stopped) {
        aiStreamStops++;
        aiStreamLast = 'stopped after ' + job.chars + ' chars';
        return '';
      }
      aiStreamLast = (mayRelease ? 'released' : 'held') + ' · ttft '
                     + aiStreamTTFT + 'ms · ' + job.chars + ' chars in '
                     + (Date.now() - job.t0) + 'ms';
      // ⚠️ AND THE ANSWER IS PUT BACK INTO THE SHAPE THE BLOCKING PATH WOULD HAVE
      // PRODUCED. See aiStreamNormalize: streaming skips upstream's own trim.
      return aiStreamNormalize(out);
    } finally {
      // The Block ALWAYS comes down, on every path — success, upstream's swallowed
      // provider error, a thrown TypeError, a stop. An editor left blocked for ever
      // would be strictly worse than the modal this slice is here to shorten.
      await end();
      aiStreamChipHide();
    }
  };
  aiStreamWrapped = true;
  return true;
}

// ARMING. The plugin frame is created by the editor some time after construction, and
// it is destroyed and rebuilt on every document swap — so this is the same shape as
// aiChatArm: a cheap, capped poll that stops the moment it succeeds.
const AI_STREAM_ARM_MAX = 90;             // ~90s, then give up quietly
let aiStreamArmIv = null;
function aiStreamDisarm() {
  if (aiStreamArmIv) { clearInterval(aiStreamArmIv); aiStreamArmIv = null; }
  aiStreamWrapped = false;                // the wrapped prototype died with the frame
  aiStreamChipHide();
}
function aiStreamArm() {
  aiStreamDisarm();
  if (!aiSeeded) return;                  // no AI tab this session — nothing to wrap
  let tries = 0;
  aiStreamArmIv = setInterval(function () {
    tries++;
    const fr = aiFrames(window);
    for (let i = 0; i < fr.length; i++) {
      try { if (aiStreamWrap(fr[i])) break; } catch (e) { /* cross-origin */ }
    }
    if (aiStreamWrapped || tries >= AI_STREAM_ARM_MAX) {
      clearInterval(aiStreamArmIv); aiStreamArmIv = null;
    }
  }, 1000);
}

// Everything that has to happen ONCE per page: the status check, the attribution, the
// 57 MB converter and api.js. Split out from openDoc precisely so a swap does not
// repeat it — that split IS the "keep one editor instance alive" requirement.
let onceDone = false;
let oncePending = null;
function once() {
  if (oncePending) return oncePending;
  oncePending = prepareOnce().finally(() => { oncePending = null; });
  return oncePending;
}
async function prepareOnce() {
  if (onceDone) return true;
  step('checking the editor bundle…', 4);
  let status;
  try {
    status = await (await fetch('/api/oo/status')).json();
  } catch (e) {
    fail('The bridge did not answer', 'Could not reach <code>/api/oo/status</code>.');
    return false;
  }
  renderAttribution(status.attribution);
  if (!status.installed) {
    fail('The editor is not installed',
         (status.reason || 'The ONLYOFFICE bundle is missing.')
         + '<br><br>Install it once with<br><code>./'
         + (status.installer || 'scripts/install_onlyoffice.sh') + '</code>');
    return false;
  }
  editorTag = status.editor_tag || '';
  step('bundle ' + (editorTag || '?') + ' · x2t ' + (status.x2t_tag || '?'), 8);

  step('loading the converter (57 MB wasm, first time only)…', 20);
  try {
    await loadX2T();
  } catch (e) {
    fail('The converter did not load', String(e.message || e));
    return false;
  }
  step('converter ready', 40);

  step('loading the editor…', 48);
  if (!apiLoaded) {
    try {
      await loadScript(API_JS);
    } catch (e) {
      fail('The editor did not load', String(e.message || e));
      return false;
    }
    apiLoaded = true;
  }
  if (typeof DocsAPI === 'undefined' || !DocsAPI.DocEditor) {
    fail('The editor did not register', 'api.js loaded but <code>DocsAPI</code> is '
         + 'not there. The vendored bundle may be incomplete — re-run <code>'
         + (status.installer || 'scripts/install_onlyoffice.sh') + '</code>.');
    return false;
  }
  // sdkjs reads `window.APP` (connectMockServer installs getImageURL onto it), so it
  // must exist first. Ours is deliberately bare — we serve no editor-side images.
  window.APP = window.APP || {};

  // The AI tab, decided ONCE per page like everything else here — the runner probe is
  // a network round trip and a document swap must not pay for it again. Deliberately
  // AFTER the editor is known to be loadable and deliberately never fatal: a gated AI
  // tab is a missing convenience, not a broken editor.
  step('checking the in-ribbon AI tab…', 50);
  try {
    await aiPrepare();
  } catch (e) {
    aiGate = 'the AI tab check failed (' + e + ')';
  }
  step(aiGate ? 'AI tab off — ' + aiGate
              : 'AI tab on — ' + ((aiStatus.runner || {}).model || 'local runner'), 52);
  tell('ai', {enabled: !aiGate, gate: aiGate,
              model: (aiStatus && aiStatus.runner && aiStatus.runner.model) || ''});

  onceDone = true;
  return true;
}

// THE ONE OPEN PATH, and the one SWAP path — they are the same function, because a
// swap that took a different route from a cold open is a second implementation of the
// hardest part of this page. `editor.destroyEditor()` (api.js's own published method:
// it replaces the inner iframe with a fresh placeholder div of the same id) is the
// only difference, and it is two lines.
function openDoc(name) {
  const want = String(name || '').trim();
  if (!want) {
    return Promise.resolve({ok: false, error: 'no workbook was named'});
  }
  const gen = ++openSeq;
  if (cancelOpening) { cancelOpening(); cancelOpening = null; }
  const t0 = (window.performance && performance.now()) || Date.now();
  const swap = !!editor;
  return (async function () {
    if (!(await once())) return {ok: false, error: 'the editor could not start'};
    if (gen !== openSeq) return {ok: false, error: 'superseded'};

    el('boot').classList.remove('gone', 'bad');
    el('bar').style.display = '';
    el('boot-title').textContent = swap ? 'Opening ' + want + '…'
                                        : 'Opening the editor…';
    el('btn-save').disabled = true;
    el('btn-pdf').disabled = true;
    ready = false;
    noteClear();

    // The mtime fence. Taken BEFORE the bytes, so a change between the two makes the
    // fence pessimistic (a refused save) rather than optimistic (a lost edit).
    let nextMtime = null;
    try {
      const files = await (await fetch('/api/office/files', {cache: 'no-store'})).json();
      const row = (files.files || []).find((f) => f.name === want);
      if (row) nextMtime = row.modified;
    } catch (e) { /* the fence is a safety net, not a precondition */ }
    if (gen !== openSeq) return {ok: false, error: 'superseded'};

    step('reading ' + want + '…', 56);
    let raw;
    try {
      const r = await fetch('/api/office/download/' + encodeURIComponent(want));
      if (!r.ok) throw new Error('the bridge said ' + r.status);
      raw = new Uint8Array(await r.arrayBuffer());
    } catch (e) {
      if (gen !== openSeq) return {ok: false, error: 'superseded'};
      fail('Could not read that workbook', String(e.message || e));
      return {ok: false, error: String(e.message || e)};
    }
    if (gen !== openSeq) return {ok: false, error: 'superseded'};
    step('read ' + Math.round(raw.length / 1024) + ' KB', 62);

    let bin;
    try {
      bin = x2tConvert(raw, want.replace(/[^A-Za-z0-9._-]/g, '_'), 'bin');
    } catch (e) {
      fail('Could not convert that workbook',
           String(e.message || e) + '<br><br>The file on disk was not touched.');
      return {ok: false, error: String(e.message || e)};
    }
    step('converted to the editor format (' + Math.round(bin.length / 1024) + ' KB)', 70);

    // ⚠️ THE OLD INSTANCE GOES DOWN HERE AND NOT EARLIER. Everything above can fail,
    // and a failure that had already destroyed a working editor would turn "could not
    // open the OTHER file" into "you no longer have an editor".
    // ⚠️ THE IN-RIBBON CHAT IS SAVED WHILE THE OLD EDITOR IS STILL ALIVE. The plugin
    // frame is a child of the editor iframe: one line later there is nothing left to
    // ask. See aiChatHandover — this is the whole "the chat vanished on a file switch"
    // fix, and it is two calls around the destroy that was already here.
    const wasDoc = DOC;
    if (editor) {
      await aiChatHandover(wasDoc, '');
      if (gen !== openSeq) return {ok: false, error: 'superseded'};
      try { editor.destroyEditor(); } catch (e) { console.log('[oo] destroy: ' + e); }
      editor = null;
    }
    // …and the incoming document's own conversation is planted BEFORE the editor is
    // constructed, and then HELD there — the plugin's own init deletes the key (trap
    // five above), so a single plant is erased by the very editor it was planted for.
    await aiChatHandover('', want);
    if (gen !== openSeq) return {ok: false, error: 'superseded'};
    DOC = want;
    openedMtime = nextMtime;
    dirtyNow = false;
    aiChatArm(want);
    // The ribbon-streaming shim dies with the plugin frame the destroy above took
    // out, so it is re-armed on every open — not once per page. A swap that quietly
    // went back to the whole-generation modal would be the worst kind of regression:
    // invisible, and only on the SECOND file.
    aiStreamArm();
    el('docname').textContent = want;
    document.title = want + ' — LOffice editor';

    const ext = (want.split('.').pop() || 'xlsx').toLowerCase();
    const blobUrl = URL.createObjectURL(new Blob([bin]));
    step('starting the editor…', 78);

    return await new Promise((resolve) => {
      let settled = false;
      const finish = (r) => {
        if (settled) return;
        settled = true;
        if (cancelOpening === cancel) cancelOpening = null;
        try { URL.revokeObjectURL(blobUrl); } catch (e) { /* already released */ }
        resolve(r);
      };
      const cancel = () => finish({ok: false, error: 'superseded'});
      cancelOpening = cancel;
      editor = new DocsAPI.DocEditor('editor', {
        document: {
          fileType: ext,
          key: 'motdeck-' + Date.now(),
          title: want,
          // ⚠️ THE Editor.bin URL, AND IT IS WHAT MAKES THE WHOLE PAGE WORK. api.js's
          // handleAuth hands this straight to the editor as the document to open; a
          // config without it produces a page that renders the full ribbon and then
          // sits on "Loading spreadsheet" for ever with ZERO console errors — the same
          // silent-hang signature as missing cross-origin isolation, and it cost this
          // rewrite two 3-minute probe runs to tell the two apart. It is a blob: of
          // OUR OWN bytes, never a third-party URL (a COEP page refuses those).
          url: blobUrl,
          // ⚠️ print: false — the serverless bundle's Print expects a DocumentServer
          // and throws. Turned off through the PUBLISHED permissions key, never by
          // patching the vendored bundle; LOffice's Help → About names the limit.
          permissions: {download: false, print: false, edit: true}
        },
        documentType: DOC_TYPES[ext] || 'cell',
        width: '100%',
        height: '100%',
        editorConfig: Object.assign({
          lang: 'en',
          mode: 'edit',
          user: {id: 'motdeck', name: 'You'},
          customization: {
            about: false, feedback: false, chat: false, comments: false,
            // ⚠️ `plugins` IS THE MASTER SWITCH, and it is computed rather than
            // constant. The plugins controller reads it FIRST and, when it is false,
            // never registers a single plugin callback and never calls loadPlugins()
            // — so a pluginsData list beside a `plugins: false` is silently ignored.
            // It stays false whenever aiPluginsConfig() gated the tab off, which
            // keeps the ribbon exactly as it was before this slice.
            help: false, plugins: !!aiPluginsConfig(), compactHeader: false,
            autosave: false, forcesave: false,
            // ⚠️ THE RIGHT PANEL STARTS CLOSED, AND THAT IS A LAYOUT DECISION MADE BY
            // LOOKING AT THE SCREENSHOT. Embedded, this editor is one column of three:
            // our file rail is on the left and our AI panel is on the right, so the
            // editor's own right-hand cell-settings panel was taking ~300px out of an
            // already-shared middle and pushing the grid to about half the window. It
            // is HIDDEN ON FIRST LOAD, not removed — the ribbon's own toggles still
            // open it, which is the honest version of "we chose a default for you".
            hideRightMenu: true,
            // ⚠️ THE EDITOR IS PINNED TO ITS LIGHT THEME, AND THIS IS NOT A TASTE CALL —
            // it is the ruling already written into bridge/panel/office.html's own
            // stylesheet: "THE SEAM IS DELIBERATE. Both tiers render a LIGHT surface — a
            // spreadsheet is a white page, and every colour inside the file (fills, font
            // colours) was chosen by somebody looking at a white page; darkening the
            // sheet would make a pale-yellow fill unreadable and would quietly
            // misrepresent the document." Left to itself the bundle follows the OS, so on
            // a dark Mac it came up `theme-night` — a dark grid under our dark chrome,
            // which reads well and lies about the document. MEASURED SECOND REASON: in
            // that theme the ribbon rendered with NO ICONS at all in a real WKWebView
            // (the bundle's dark icon set does not paint; every glyph an empty box),
            // while the light theme's ribbon is complete. `default-light` is the value
            // api-orig.js documents, and it is passed as a config parameter — nothing in
            // the vendored bundle is touched.
            uiTheme: 'default-light',
            features: {
              // The bundle's own "New: Cell text direction" onboarding balloon,
              // which on a fresh profile opens over the ribbon and sits there. It is
              // ONLYOFFICE telling a first-time user about ONLYOFFICE; inside LOffice
              // it is a popover nobody can act on and it landed square across the
              // formula bar in the first embedded screenshot.
              featuresTips: false
            }
          }
        }, aiPluginsConfig() ? {plugins: aiPluginsConfig()} : {}),
        events: {
          onAppReady: () => { if (gen === openSeq) step('editor frame ready', 88); },
          onDocumentReady: () => {
            if (gen !== openSeq) return;       // a later open superseded this one
            ready = true;
            el('boot').classList.add('gone');
            el('btn-save').disabled = false;
            el('btn-pdf').disabled = false;
            state('ready');
            // The editor keeps the document; the blob has been read.
            try { URL.revokeObjectURL(blobUrl); } catch (e) { /* fine */ }
            const ms = Math.round(((window.performance && performance.now())
                                   || Date.now()) - t0);
            tell('ready', {doc: want, mtime: openedMtime, ms: ms, swap: swap,
                           editorTag: editorTag});
            finish({ok: true, ms: ms, swap: swap});
          },
          onError: (e) => {
            if (gen !== openSeq) return;
            const d = e && e.data;
            fail('The editor reported an error',
                 '<code>' + JSON.stringify(d) + '</code>');
            finish({ok: false, error: 'the editor reported ' + JSON.stringify(d)});
          },
          onWarning: (e) => { console.log('[oo warning]', e && e.data); },
          onDocumentStateChange: (e) => {
            // ⚠️ THIS IS THE PAGE'S DIRTY FLAG, AND NOW THE PARENT'S TOO. The LOffice
            // strip's dot, its "unsaved changes" line and the heartbeat the bridge
            // uses to refuse an agent write all hang off this one event.
            if (!ready || gen !== openSeq) return;
            const d = !!(e && e.data);
            /* ⚠️ THE FRESH-OPEN PHANTOM (roadmap §9.2). The block above innerEditor()
               carries the whole measurement: this is ONLYOFFICE's own AI plugin
               registering its custom functions into the document's undo history at
               autostart. FAIL-CLOSED — if the history is not provably nothing but that
               registration, or if sdkjs will not agree afterwards that the document is
               unmodified, this arm does nothing and the dirty:true is reported as before. */
            if (d && !dirtyNow && !saving && historyIsPluginOnly() && clearPluginDirty()) {
              state('ready');
              return;
            }
            /* ⚠️⚠️ SECOND HALF OF THE L1 FIX, AND IT IS THE FLOOR UNDER THE FIRST. sdkjs
               fires dirty:FALSE whenever IT believes the document is saved — which, with
               a mock co-authoring server that ACKs `saveChanges`, means "the ACK arrived",
               not "bytes reached the disk". Forwarding that cleared the parent's dirty
               flag with nothing on disk, and the next file switch binned the work with no
               warning at all.
               A CLEAR IS ONLY BELIEVED WHEN A WRITE-BACK PRODUCED IT. A pending save
               is not yet proof; save() verifies both the receipt and the current
               serialized document. When dirtyNow is false this event is a no-op. Anything else
               is sdkjs's opinion about a save that did not happen, and the honest answer
               is to STAY DIRTY and say so. Never the other way round: a dirty:TRUE is
               always believed, because unsaved work is never something to be optimistic
               about. */
            if (!d && dirtyNow) {
              heldClears++;
              state('unsaved changes — the editor thinks it saved, but nothing was '
                    + 'written to the file yet');
              tell('state', {dirty: true});
              return;
            }
            dirtyNow = d;
            state(d ? 'unsaved changes' : 'ready');
            tell('state', {dirty: d});
          }
        }
      });
      editor.connectMockServer(mockServer());
      step('waiting for the document…', 92);
    });
  })();
}

// Re-read the CURRENT workbook from disk. The external-change banner in the parent
// calls this instead of reloading the whole LOffice page — which was the old answer
// and threw away the warm editor to do it.
function reloadDoc() { return openDoc(DOC); }

/* ══ THE DOCUMENT'S NAME MOVED, AND THE EDITOR HAS TO BE TOLD ══════════════════
   THE FIX FOR live finding B1, and the finding is worth restating because it is the most
   expensive kind of bug this page can have: unsaved work that can NEVER be written.

   Measured: open QA-A.xlsx → type something (dot on) → rename it from the rail to
   "QA-A renamed". The rename succeeded, the title updated, and the dot stayed on
   deliberately ("a rename is not a save"). But NOTHING TOLD THE EDITOR: `DOC` was still
   the old name, so the next Save posted to /api/office/writeback/QA-A.xlsx, got a 404, and
   answered "Not saved: no such workbook". There was no way out that kept the work —
   saving always 404'd, reopening discarded the edit, and the message named no file and
   offered no next step.

   THE EMBED CONTRACT FOLLOWS THE RENAME. It is a NAME change and nothing else: the bytes
   did not move (os.rename preserves both content and mtime), so the document in memory,
   the dirty flag and `openedMtime` are all still correct and are deliberately left alone.
   Re-opening the file here would have been the "simpler" answer and it would have thrown
   away the very edits the finding is about. */
function renameTo(to) {
  const want = String(to || '').trim();
  if (!want) return {ok: false, error: 'no new name was given'};
  const from = DOC;
  DOC = want;
  // ⚠️ THE CONVERSATION IS KEYED ON THE FILE NAME, SO A RENAME HAS TO CARRY IT. Without
  // this the chat about this very sheet would be orphaned under the OLD name and the
  // renamed file would open with an empty panel — the "another feature touched the same
  // data" journey, and a silent loss of the user's own words. It is a key move, not a
  // re-save: whatever was stored is exactly what the new name should hold.
  // Retargeting the save destination must survive a storage/UI failure.
  try { aiChatRename(from, want); aiChatArm(want); }
  catch (e) { console.log('[oo rename chat] ' + e); }
  el('docname').textContent = want;
  document.title = want + ' — LOffice editor';
  // The note strip, if it is showing a stale "no such workbook", is now wrong.
  noteClear();
  if (dirtyNow) state('unsaved changes');
  return {ok: true, doc: DOC, was: from};
}

// ── the API the parent gets, i.e. the contract ────────────────────────────────
window.LOfficeEmbed = {
  // ⚠️ BUMPED 3 → 4 AT loffice-2026-08-29a: `downloadPdf` is a new member (Download as
  // PDF, which replaces the Print this bundle cannot do). Bumped 2 → 3 at
  // loffice-2026-08-28d for `renameTo` (live finding B1).
  // The parent probes for the FUNCTION rather than the number (a version check that gates
  // a capability the object plainly has is a way to break a working page), so an older
  // frame degrades to an honest sentence rather than to a silent 404 on the next save.
  contract: 4,
  open: openDoc,
  save: save,
  // Export + the blob download, in one call, INSIDE this frame — one implementation for
  // LOffice's menu and for this page's own PDF button. Resolves to
  // {ok, pages, name, ms} or {ok:false, error}; the bytes stay here.
  downloadPdf: downloadPdf,
  reload: reloadDoc,
  renameTo: renameTo,
  applyOps: applyOps,
  readCells: readCells,
  selection: selection,
  probe: () => ({ready: ready, doc: DOC, dirty: dirtyNow, saving: saving,
                 editorTag: editorTag, extSaves: extSaves,
                 heldClears: heldClears,
                 // THE TWO RENDER-TRUTH COUNTERS (roadmap §9.2 / §9.3), reported for the
                 // same reason heldClears is: a probe can PROVE each fix ran instead of
                 // inferring it from a screenshot. `pluginDirtyClears` counts the phantom
                 // fresh-open dirties reconciled; `paint` says whether the supported
                 // repaint pair is present in this editor build at all.
                 pluginDirtyClears: pluginDirtyClears,
                 paint: {tag: OO_PAINT_TAG, missing: paintMissing,
                         canRun: !!(innerEditor()
                                    && typeof innerEditor().canRunBuilderScript === 'function'),
                         canEnd: !!(innerEditor()
                                    && typeof innerEditor().asc_Recalculate === 'function')},
                 // The AI tab, reported the same way the save counters are: a probe can
                 // prove it is on (and with which model) or read the exact reason it is
                 // off, instead of inferring either from a screenshot.
                 ai: {enabled: !aiGate && !!aiSeeded, gate: aiGate,
                      model: (aiStatus && aiStatus.runner
                              && aiStatus.runner.model) || '',
                      version: (aiStatus && aiStatus.version) || '',
                      // The chat-persistence counters, reported for the same reason the
                      // save counters are: a probe can PROVE the handover ran on this
                      // swap instead of inferring it from a screenshot.
                      chat: {key: AI_CHAT_KEY, pinned: AI_CHAT_PLUGIN_VER,
                             saves: aiChatSaves, restores: aiChatRestores,
                             drops: aiChatDrops, holds: aiChatHolds,
                             files: aiChatIndex().length,
                             last: aiChatLast, live: !!aiChatWindow()},
                      // The ribbon-streaming shim, reported the same way: a probe can
                      // PROVE it wrapped the live prototype, that a run released the
                      // Block (or deliberately held it), and what the first chunk cost
                      // — instead of any of that being inferred from a screenshot.
                      stream: {pinned: AI_STREAM_PLUGIN_VER, wrapped: aiStreamWrapped,
                               calls: aiStreamCalls, releases: aiStreamReleases,
                               stops: aiStreamStops, ttft: aiStreamTTFT,
                               modal: aiStreamModal(), last: aiStreamLast}}}),
  destroy: async () => {
    const gen = ++openSeq;
    if (cancelOpening) { cancelOpening(); cancelOpening = null; }
    // Same rule as the swap: the conversation is saved while the frame that holds it
    // is still there. A host that tears the embed down does not lose the chat either.
    if (editor) { await aiChatHandover(DOC, ''); }
    if (gen !== openSeq) return;
    if (editor) { try { editor.destroyEditor(); } catch (e) { /* gone */ } }
    aiStreamDisarm();   // the chip must not outlive the editor it was reporting on
    if (aiChatHold) { clearInterval(aiChatHold); aiChatHold = null; }
    editor = null; ready = false; dirtyNow = false;
  }
};

// A page-level guard: any throw here would otherwise leave the boot overlay saying
// "Opening…" forever, which is the exact failure mode this whole lane keeps hitting.
window.addEventListener('error', (e) => {
  if (!ready) fail('Something broke while opening',
                   '<code>' + String(e.message || 'unknown') + '</code>');
});

// THE HANDSHAKE. The parent exists before this frame does (it created the iframe), so
// there is nothing to wait for and no retry loop: register, then open.
if (HOST && typeof HOST.register === 'function') {
  try { HOST.register(window.LOfficeEmbed); }
  catch (e) { console.log('[oo host register] ' + e); }
}

if (DOC0) {
  openDoc(DOC0).catch((e) => fail('Something broke while opening',
                                  '<code>' + String((e && e.message) || e) + '</code>'));
} else if (!EMBED) {
  fail('No workbook named', 'Open this page from LOffice — it needs '
       + '<code>?doc=&lt;file name&gt;</code>.');
} else {
  // Embedded with no doc yet: the parent will call open() when it has one. Say so
  // rather than showing a spinner that will never finish.
  el('boot-title').textContent = 'No workbook open';
  el('boot-msg').textContent = 'Pick a spreadsheet in the file list.';
  el('bar').style.display = 'none';
}
</script>
</body>
</html>
