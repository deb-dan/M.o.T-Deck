name: harness-path-guard
version: "0.1.0"
description: "Path-guard fence for Hermes file writes. write_file/patch targets are
  matched against a policy allowlist (session workspace, ~/.hermes, the harness data
  dir, temp): inside → proceed untouched; a hard-deny root (~/.ssh, ~/.aws, ~/.gnupg,
  keychains, the agent's own config) → blocked outright; anything else escalates into
  the SAME human approval gate dangerous shell commands use, so the Harness panel
  renders it with its existing approval card. Fail-closed: any internal error
  escalates rather than allowing. Seeded to ~/.hermes/plugins/ by the harness
  (scripts/start_component.sh); source of truth = guards/harness-path-guard/ in the
  harness repo — do not hand-edit the seeded copy."
author: "Harness (New Harness project)"
kind: standalone
hooks:
  - pre_tool_call
provides_hooks:
  - pre_tool_call
