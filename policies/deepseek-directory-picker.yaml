# MOT Deck composes DeepSeek Harness's own browse backend and client dialog instead of
# its macOS osascript chooser.  The native chooser was proven to spawn but never became
# reachable from the embedded WKWebView app.  These are upstream plugin ids/names; no
# vendored DeepSeek file is patched or forked.
- id: directory-picker
  disabled: true
- insert:
  - id: directory-picker-browse-host
    name: '@deepseek-ai/dsh-host-directory-picker-browse'
  - id: directory-picker-browse-client
    name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
